<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stranded's Unblocked Games</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    :root {
      --bg-gradient: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
      --card-bg: rgba(30, 41, 59, 0.85);
      --card-hover: #334155;
      --text-color: #f1f5f9;
      --heading-color: #ffffff;
      --accent-color: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --border-color: rgba(255, 255, 255, 0.08);
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-color);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      scroll-behavior: smooth;
      -webkit-font-smoothing: antialiased;
    }

    body {
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    header {
      margin-bottom: 2.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 1200px;
    }

    .title-container {
      position: relative;
      padding: 1.75rem 3rem;
      margin-bottom: 0.75rem;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.7) 0%, rgba(15, 23, 42, 0.8) 100%);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.3);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 
                  0 0 30px var(--accent-glow),
                  inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }

    h1 {
      font-size: 2.75rem;
      font-weight: 800;
      margin: 0;
      background: linear-gradient(135deg, #ffffff 30%, #7dd3fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      letter-spacing: 3px;
      filter: drop-shadow(0 4px 12px rgba(56, 189, 248, 0.3));
    }

    p.subtitle {
      color: #94a3b8;
      margin: 0 0 1.5rem 0;
      font-size: 1.05rem;
      font-weight: 400;
      letter-spacing: 0.5px;
    }

    .controls-row {
      display: flex;
      gap: 1rem;
      width: 100%;
      max-width: 600px;
      margin-bottom: 1rem;
      justify-content: center;
      position: relative;
    }

    .search-wrapper {
      flex: 1;
      min-width: 250px;
      position: relative;
    }

    #search-input {
      width: 100%;
      padding: 0.85rem 1.2rem;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: var(--text-color);
      font-size: 1rem;
      outline: none;
      transition: all 0.25s ease;
      text-align: center;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
    }

    #search-input::placeholder {
      text-align: center;
      color: #64748b;
    }

    #search-input:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2), inset 0 2px 4px rgba(0,0,0,0.2);
    }

    .autocomplete-dropdown {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      width: 100%;
      background: #090d16;
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 10px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
      z-index: 100;
      display: none;
      max-height: 200px;
      overflow-y: auto;
    }

    .autocomplete-item {
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      color: #cbd5e1;
      cursor: pointer;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      transition: background 0.15s, color 0.15s;
    }

    .autocomplete-item:last-child {
      border-bottom: none;
    }

    .autocomplete-item:hover {
      background: var(--card-hover);
      color: var(--accent-color);
    }

    .section-title {
      width: 100%;
      max-width: 1200px;
      font-size: 1.3rem;
      font-weight: 700;
      margin: 1.5rem 0 0.75rem 0;
      color: #7dd3fc;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      letter-spacing: 0.5px;
    }

    .grid {
      width: 100%;
      max-width: 1200px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.75rem;
      margin-bottom: 2rem;
      justify-items: center;
    }

    .game-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      overflow: hidden;
      text-decoration: none;
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      position: relative;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
      width: 100%;
    }

    .game-card:hover {
      transform: translateY(-6px);
      background-color: var(--card-hover);
      border-color: rgba(56, 189, 248, 0.4);
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5), 0 0 15px rgba(56, 189, 248, 0.15);
    }

    .card-image-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: #050811;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-image-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      transition: transform 0.4s ease;
    }

    .game-card:hover .card-image-wrap img {
      transform: scale(1.06);
    }

    .card-content {
      padding: 1.1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
    }

    .card-content h3 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 700;
      text-align: center;
      color: var(--heading-color);
      letter-spacing: 0.3px;
    }

    .card-tags {
      display: flex;
      gap: 0.35rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .card-tag {
      font-size: 0.75rem;
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.15);
      padding: 3px 8px;
      border-radius: 6px;
      color: #93c5fd;
      font-weight: 500;
    }

    .scroll-top-btn {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background-color: var(--card-bg);
      border: 1px solid rgba(56, 189, 248, 0.2);
      color: var(--accent-color);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease, background-color 0.2s, box-shadow 0.2s;
      z-index: 99;
    }

    .scroll-top-btn.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .scroll-top-btn:hover {
      background-color: var(--card-hover);
      transform: translateY(-4px);
      box-shadow: 0 15px 30px rgba(0,0,0,0.6), 0 0 15px rgba(56, 189, 248, 0.2);
    }

    .loading-text, .error-text {
      grid-column: 1 / -1;
      text-align: center;
      color: #94a3b8;
      font-size: 1.15rem;
      padding: 3rem 0;
    }
  </style>
</head>
<body>

  <header>
    <div class="title-container">
      <h1>Stranded's Unblocked Games</h1>
    </div>
    <p class="subtitle">Select a portal or collection below</p>
    
    <div class="controls-row">
      <div class="search-wrapper">
        <input type="text" id="search-input" placeholder="Search hubs..." autocomplete="off">
        <div class="autocomplete-dropdown" id="autocomplete-dropdown"></div>
      </div>
    </div>
  </header>

  <div class="section-title">📂 Hubs & Collections</div>
  <div id="game-grid" class="grid">
    <div class="loading-text">Loading hubs...</div>
  </div>

  <button class="scroll-top-btn" id="scroll-top-btn" title="Scroll to top">↑</button>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const gridContainer = document.getElementById("game-grid");
      const searchInput = document.getElementById("search-input");
      const autocompleteDropdown = document.getElementById("autocomplete-dropdown");
      const scrollTopBtn = document.getElementById("scroll-top-btn");

      let allHubs = [];

      function renderCards(list) {
        gridContainer.innerHTML = "";
        if (list.length === 0) {
          gridContainer.innerHTML = '<div class="error-text">No matching portals found.</div>';
          return;
        }

        list.forEach(hub => {
          const card = document.createElement("a");
          card.href = encodeURI(hub.url);
          card.className = "game-card";

          const tagsHtml = (hub.tags || []).map(t => `<span class="card-tag">${t}</span>`).join("");
          const thumbnailSrc = hub.thumbnail ? `assets/${hub.thumbnail}` : 'assets/default.jpg';

          card.innerHTML = `
            <div class="card-image-wrap">
              <img src="${thumbnailSrc}" alt="${hub.title}" loading="lazy">
            </div>
            <div class="card-content">
              <h3>${hub.title}</h3>
              <div class="card-tags">${tagsHtml}</div>
            </div>
          `;
          gridContainer.appendChild(card);
        });
      }

      function updateAutocomplete(query) {
        if (!query) {
          autocompleteDropdown.style.display = "none";
          autocompleteDropdown.innerHTML = "";
          return;
        }

        const matches = allHubs.filter(h => h.title.toLowerCase().includes(query)).slice(0, 5);
        if (matches.length === 0) {
          autocompleteDropdown.style.display = "none";
          autocompleteDropdown.innerHTML = "";
          return;
        }

        autocompleteDropdown.innerHTML = "";
        matches.forEach(hub => {
          const item = document.createElement("div");
          item.className = "autocomplete-item";
          item.textContent = hub.title;
          item.addEventListener("click", () => {
            searchInput.value = hub.title;
            autocompleteDropdown.style.display = "none";
            applyFilter();
          });
          autocompleteDropdown.appendChild(item);
        });
        autocompleteDropdown.style.display = "block";
      }

      function applyFilter() {
        const query = searchInput.value.toLowerCase().trim();
        updateAutocomplete(query);

        const filtered = allHubs.filter(hub => {
          if (query && !hub.title.toLowerCase().includes(query)) return false;
          return true;
        });

        renderCards(filtered);
      }

      fetch("hubs.json")
        .then(response => {
          if (!response.ok) throw new Error("Failed to load hubs.json");
          return response.json();
        })
        .then(hubs => {
          allHubs = hubs;
          applyFilter();
        })
        .catch(error => {
          console.error("Error loading hubs list:", error);
          gridContainer.innerHTML = '<div class="error-text">Failed to load hubs list. Make sure hubs.json is present.</div>';
        });

      searchInput.addEventListener("input", applyFilter);

      document.addEventListener("click", (e) => {
        if (!e.target.closest(".search-wrapper")) {
          autocompleteDropdown.style.display = "none";
        }
      });

      window.addEventListener("scroll", () => {
        if (window.scrollY > 300) {
          scrollTopBtn.classList.add("visible");
        } else {
          scrollTopBtn.classList.remove("visible");
        }
      });

      scrollTopBtn.addEventListener("click", () => {
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    });
  </script>
</body>
</html>
