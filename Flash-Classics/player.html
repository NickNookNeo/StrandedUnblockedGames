<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flash Player</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    :root {
      --bg-gradient: radial-gradient(circle at center, #1e293b 0%, #050811 100%);
      --card-bg: rgba(30, 41, 59, 0.9);
      --card-hover: #334155;
      --text-color: #f8fafc;
      --accent-color: #38bdf8;
      --border-color: rgba(255, 255, 255, 0.1);
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: radial-gradient(circle at center, #1e293b 0%, #050811 100%) !important;
      background-attachment: fixed !important;
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      user-select: none;
    }

    body {
      padding: 0.4rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    .header-container {
      width: 100%;
      max-width: 1200px;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      flex-shrink: 0;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      width: 100%;
    }

    .back-btn {
      color: var(--text-color);
      text-decoration: none;
      background-color: var(--card-bg);
      backdrop-filter: blur(8px);
      padding: 0.3rem 0.6rem;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      border: 1px solid var(--border-color);
      transition: background-color 0.2s, color 0.2s;
    }

    .back-btn:hover {
      background-color: var(--card-hover);
      color: var(--accent-color);
    }

    h1.game-title {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.15rem;
      font-weight: 800;
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #ffffff 0%, var(--accent-color) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      pointer-events: none;
    }

    .header-controls {
      display: flex;
      justify-content: center;
      gap: 6px;
      width: 100%;
    }

    .player-wrapper {
      position: relative;
      width: 100%;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent !important;
      overflow: hidden !important;
      border: none !important;
      outline: none;
      min-height: 0;
    }

    /* Fluid container driven strictly by the dynamic aspect ratio computed from SWF metadata */
    .game-container {
      position: relative;
      height: 100%;
      max-width: 100%;
      aspect-ratio: var(--game-aspect, 4 / 3);
      max-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden !important;
      background: #000 !important;
      border-radius: 6px;
    }

    ruffle-player {
      width: 100% !important;
      height: 100% !important;
      display: block !important;
      background: transparent !important;
      overflow: hidden !important;
    }

    ruffle-player::part(container),
    ruffle-player::part(canvas) {
      width: 100% !important;
      height: 100% !important;
      background: transparent !important;
      overflow: hidden !important;
    }

    .player-wrapper:fullscreen,
    .player-wrapper:-webkit-full-screen,
    .player-wrapper:-moz-full-screen {
      width: 100vw !important;
      height: 100vh !important;
      max-width: 100vw !important;
      max-height: 100vh !important;
      background: radial-gradient(circle at center, #1e293b 0%, #050811 100%) !important;
      overflow: hidden !important;
      margin: 0 !important;
    }

    .player-wrapper::backdrop {
      background: radial-gradient(circle at center, #1e293b 0%, #050811 100%) !important;
    }

    .control-hover-trigger {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 10px;
      z-index: 49;
    }

    .control-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      padding: 6px 10px;
      border-top: 1px solid var(--border-color);
      transform: translateY(100%);
      transition: transform 0.25s ease-in-out;
      z-index: 50;
    }

    .control-hover-trigger:hover + .control-bar,
    .control-bar:hover,
    .control-bar.visible {
      transform: translateY(0);
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .control-btn {
      padding: 4px 10px;
      background-color: rgba(255, 255, 255, 0.05);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 600;
      transition: background-color 0.2s, color 0.2s;
    }

    .control-btn:hover {
      background-color: var(--card-hover);
      color: var(--accent-color);
    }

    .volume-slider {
      width: 70px;
      cursor: pointer;
      accent-color: var(--accent-color);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 8, 17, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      width: 90%;
      max-width: 520px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.9);
      max-height: 85vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.5rem;
    }

    .modal-header h3 {
      margin: 0;
      color: var(--accent-color);
    }

    .close-modal-btn {
      background: transparent;
      border: none;
      color: var(--text-color);
      font-size: 1.4rem;
      cursor: pointer;
    }

    .bind-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: 6px;
    }

    .bind-key {
      padding: 5px 12px;
      background: var(--card-bg);
      border: 1px solid var(--accent-color);
      color: var(--accent-color);
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.8rem;
      cursor: pointer;
      min-width: 120px;
      text-align: center;
    }

    .bind-key.listening {
      background: var(--accent-color);
      color: #000;
    }

    body.theater-mode .header-container { display: none !important; }
    body.theater-mode .player-wrapper {
      max-width: 100vw !important;
      width: 100vw !important;
      height: 100vh !important;
      border-radius: 0 !important;
      border: none !important;
      margin: 0 !important;
    }
  </style>

  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      "scale": "showAll",
      "forceScale": true,        /* Blocks games from breaking aspect ratios */
      "forceAlign": true,        /* Blocks games from offsetting canvas bounds */
      "letterbox": "on",
      "wmode": "transparent",
      "backgroundColor": null
    };
  </script>
</head>
<body>

  <div class="header-container">
    <div class="header-top">
      <a href="index.html" class="back-btn">&larr; Games List</a>
      <h1 class="game-title" id="display-title">Loading...</h1>
      <div style="width: 80px;"></div>
    </div>
    
    <div class="header-controls">
      <button class="control-btn" id="kb-btn">Keyboard Binds</button>
      <button class="control-btn" id="mapper-btn">Controller Binds</button>
    </div>
  </div>

  <div class="player-wrapper" id="player-wrapper" tabindex="0">
    <div class="game-container" id="game-container">
      <div class="control-hover-trigger"></div>

      <div class="control-bar" id="control-bar">
        <div class="control-group">
          <button class="control-btn" id="play-pause-btn">Pause</button>
          <button class="control-btn" id="reload-btn">Restart</button>
          <input type="range" class="volume-slider" id="volume-slider" min="0" max="1" step="0.05" value="1" title="Volume">
        </div>
        <div class="control-group">
          <button class="control-btn" id="theater-btn">Theater</button>
          <button class="control-btn" id="fs-btn">Fullscreen</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modals -->
  <div class="modal-overlay" id="kb-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Keyboard Binds</h3>
        <button class="close-modal-btn" id="close-kb">&times;</button>
      </div>
      <div class="bind-row">
        <span>Left Arrow ➔</span>
        <button class="bind-key kb-bind" data-target="ArrowLeft">ArrowLeft</button>
      </div>
      <div class="bind-row">
        <span>Right Arrow ➔</span>
        <button class="bind-key kb-bind" data-target="ArrowRight">ArrowRight</button>
      </div>
      <div class="bind-row">
        <span>Up Arrow ➔</span>
        <button class="bind-key kb-bind" data-target="ArrowUp">ArrowUp</button>
      </div>
      <div class="bind-row">
        <span>Down Arrow ➔</span>
        <button class="bind-key kb-bind" data-target="ArrowDown">ArrowDown</button>
      </div>
      <div class="bind-row">
        <span>Key 'A' ➔</span>
        <button class="bind-key kb-bind" data-target="KeyA">A</button>
      </div>
      <div class="bind-row">
        <span>Key 'S' ➔</span>
        <button class="bind-key kb-bind" data-target="KeyS">S</button>
      </div>
      <div class="bind-row">
        <span>Key 'D' ➔</span>
        <button class="bind-key kb-bind" data-target="KeyD">D</button>
      </div>
      <div class="bind-row">
        <span>Spacebar ➔</span>
        <button class="bind-key kb-bind" data-target="Space">Space</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="mapper-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Controller Binds</h3>
        <button class="close-modal-btn" id="close-mapper">&times;</button>
      </div>
      <p style="font-size: 0.8rem; color: #38bdf8; margin: 0;" id="pad-status">Searching for controller...</p>
      <div class="bind-row">
        <span>Button A ➔</span>
        <button class="bind-key pad-bind" data-pad-btn="0">A</button>
      </div>
      <div class="bind-row">
        <span>Button B ➔</span>
        <button class="bind-key pad-bind" data-pad-btn="1">S</button>
      </div>
      <div class="bind-row">
        <span>Button X ➔</span>
        <button class="bind-key pad-bind" data-pad-btn="2">A</button>
      </div>
      <div class="bind-row">
        <span>Button Y ➔</span>
        <button class="bind-key pad-bind" data-pad-btn="3">D</button>
      </div>
      <div class="bind-row">
        <span>Left Bumper (LB) ➔</span>
        <button class="bind-key pad-bind" data-pad-btn="4">ShiftLeft</button>
      </div>
      <div class="bind-row">
        <span>Right Bumper (RB) ➔</span>
        <button class="bind-key pad-bind" data-pad-btn="5">Space</button>
      </div>
    </div>
  </div>

  <script>
    window.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const gameFile = urlParams.get("game") || "cactusmccoy.swf";
      const gameTitle = urlParams.get("title") || "Flash Game";

      document.getElementById("display-title").textContent = gameTitle;
      document.title = `${gameTitle} - Flash Player`;

      const gameContainer = document.getElementById("game-container");

      // Use Ruffle's native JS API to instantiate the player dynamically
      const ruffle = window.RufflePlayer.newest();
      const player = ruffle.createPlayer();
      gameContainer.insertBefore(player, gameContainer.firstChild);
      player.load(`assets/${gameFile}`);

      const wrapper = document.getElementById("player-wrapper");
      const kbModal = document.getElementById("kb-modal");
      const mapperModal = document.getElementById("mapper-modal");
      const padStatus = document.getElementById("pad-status");
      const volumeSlider = document.getElementById("volume-slider");

      let activeListeningBtn = null;
      let listeningType = null;
      let isPaused = false;

      // Automatically reads metadata width and height directly from the loaded SWF to update container aspect ratio dynamically
      function updateAspectRatio() {
        if (!player || !player.metadata) return false;
        const w = player.metadata.width;
        const h = player.metadata.height;

        if (w > 0 && h > 0) {
          gameContainer.style.setProperty('--game-aspect', `${w} / ${h}`);
          return true;
        }
        return false;
      }

      const ratioPoll = setInterval(() => {
        if (updateAspectRatio()) {
          clearInterval(ratioPoll);
        }
      }, 50);

      setTimeout(() => clearInterval(ratioPoll), 5000);

      const defaultKeyMap = {
        ArrowLeft:  { key: "ArrowLeft",  code: "ArrowLeft",  keyCode: 37 },
        ArrowRight: { key: "ArrowRight", code: "ArrowRight", keyCode: 39 },
        ArrowUp:    { key: "ArrowUp",    code: "ArrowUp",    keyCode: 38 },
        ArrowDown:  { key: "ArrowDown",  code: "ArrowDown",  keyCode: 40 },
        KeyA:       { key: "a",          code: "KeyA",       keyCode: 65 },
        KeyS:       { key: "s",          code: "KeyS",       keyCode: 83 },
        KeyD:       { key: "d",          code: "KeyD",       keyCode: 68 },
        Space:      { key: " ",          code: "Space",      keyCode: 32 },
        ShiftLeft:  { key: "Shift",      code: "ShiftLeft",  keyCode: 16 }
      };

      const savedKeyMap = localStorage.getItem("flash_key_map");
      const keyMap = savedKeyMap ? JSON.parse(savedKeyMap) : defaultKeyMap;

      const savedPadMap = localStorage.getItem("flash_pad_map");
      const controllerBinds = savedPadMap ? JSON.parse(savedPadMap) : {
        0: keyMap.KeyA,
        1: keyMap.KeyS,
        2: keyMap.KeyA,
        3: keyMap.KeyD,
        4: keyMap.ShiftLeft,
        5: keyMap.Space
      };

      const activePadState = {};

      function saveBindings() {
        localStorage.setItem("flash_key_map", JSON.stringify(keyMap));
        localStorage.setItem("flash_pad_map", JSON.stringify(controllerBinds));
      }

      function updateBindButtonsDisplay() {
        document.querySelectorAll(".kb-bind").forEach(btn => {
          const target = btn.getAttribute("data-target");
          if (keyMap[target]) {
            btn.textContent = keyMap[target].key === " " ? "Space" : keyMap[target].key.toUpperCase();
          }
        });
        document.querySelectorAll(".pad-bind").forEach(btn => {
          const idx = btn.getAttribute("data-pad-btn");
          if (controllerBinds[idx]) {
            btn.textContent = controllerBinds[idx].key === " " ? "Space" : controllerBinds[idx].key.toUpperCase();
          }
        });
      }
      updateBindButtonsDisplay();

      document.getElementById("fs-btn").addEventListener("click", () => {
        if (!document.fullscreenElement) wrapper.requestFullscreen();
        else document.exitFullscreen();
      });

      document.getElementById("theater-btn").addEventListener("click", () => {
        document.body.classList.toggle("theater-mode");
      });

      document.getElementById("play-pause-btn").addEventListener("click", (e) => {
        if (!player) return;
        if (isPaused) { 
          if (typeof player.play === "function") player.play(); 
          e.target.textContent = "Pause"; 
        } else { 
          if (typeof player.pause === "function") player.pause(); 
          e.target.textContent = "Play"; 
        }
        isPaused = !isPaused;
      });

      document.getElementById("reload-btn").addEventListener("click", () => {
        if (player && typeof player.reload === "function") {
          player.reload();
        }
      });

      volumeSlider.addEventListener("input", (e) => {
        if (player) {
          const val = parseFloat(e.target.value);
          if (typeof player.setVolume === "function") {
            player.setVolume(val);
          } else {
            player.volume = val;
          }
        }
      });

      function focusPlayer() {
        wrapper.focus();
      }

      document.getElementById("kb-btn").onclick = () => kbModal.classList.add("open");
      document.getElementById("close-kb").onclick = () => {
        kbModal.classList.remove("open");
        focusPlayer();
      };

      document.getElementById("mapper-btn").onclick = () => mapperModal.classList.add("open");
      document.getElementById("close-mapper").onclick = () => {
        mapperModal.classList.remove("open");
        focusPlayer();
      };

      document.querySelectorAll(".bind-key").forEach(btn => {
        btn.addEventListener("click", (e) => {
          if (activeListeningBtn) activeListeningBtn.classList.remove("listening");
          activeListeningBtn = e.target;
          listeningType = btn.classList.contains("kb-bind") ? "kb" : "pad";
          activeListeningBtn.classList.add("listening");
          activeListeningBtn.textContent = "Press Key...";
        });
      });

      window.addEventListener("keydown", (e) => {
        if (!activeListeningBtn) return;

        e.preventDefault();
        const displayLabel = e.key === " " ? "Space" : (e.key.length === 1 ? e.key.toUpperCase() : e.key);

        if (listeningType === "kb") {
          const targetKey = activeListeningBtn.getAttribute("data-target");
          keyMap[targetKey] = { key: e.key, code: e.code, keyCode: e.keyCode };
          activeListeningBtn.textContent = displayLabel;
        } else if (listeningType === "pad") {
          const padIdx = activeListeningBtn.getAttribute("data-pad-btn");
          controllerBinds[padIdx] = { key: e.key, code: e.code, keyCode: e.keyCode };
          activeListeningBtn.textContent = displayLabel;
        }

        saveBindings();
        activeListeningBtn.classList.remove("listening");
        activeListeningBtn = null;
      });

      function sendSyntheticKey(type, keyInfo) {
        if (!player || !keyInfo) return;
        player.dispatchEvent(new KeyboardEvent(type, {
          key: keyInfo.key,
          code: keyInfo.code,
          keyCode: keyInfo.keyCode,
          bubbles: true,
          cancelable: true
        }));
      }

      window.addEventListener("gamepaddisconnected", () => {
        padStatus.textContent = "Controller disconnected.";
        Object.keys(activePadState).forEach(stateKey => {
          if (activePadState[stateKey]) {
            if (stateKey.startsWith('d_')) {
              const dirMap = {
                d_left: keyMap.ArrowLeft,
                d_right: keyMap.ArrowRight,
                d_up: keyMap.ArrowUp,
                d_down: keyMap.ArrowDown
              };
              sendSyntheticKey('keyup', dirMap[stateKey]);
            } else if (controllerBinds[stateKey]) {
              sendSyntheticKey('keyup', controllerBinds[stateKey]);
            }
            activePadState[stateKey] = false;
          }
        });
      });

      function gameLoop() {
        const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
        const gp = gamepads[0] || gamepads[1] || gamepads[2] || gamepads[3];

        if (gp) {
          padStatus.textContent = `Connected: ${gp.id.substring(0, 30)}...`;

          const axisX = gp.axes[0];
          const axisY = gp.axes[1];

          const dLeft  = (gp.buttons[14] && gp.buttons[14].pressed) || axisX < -0.5;
          const dRight = (gp.buttons[15] && gp.buttons[15].pressed) || axisX > 0.5;
          const dUp    = (gp.buttons[12] && gp.buttons[12].pressed) || axisY < -0.5;
          const dDown  = (gp.buttons[13] && gp.buttons[13].pressed) || axisY > 0.5;

          const handleDirection = (stateKey, isPressed, outputKeyInfo) => {
            if (isPressed && !activePadState[stateKey]) {
              sendSyntheticKey('keydown', outputKeyInfo);
              activePadState[stateKey] = true;
            } else if (!isPressed && activePadState[stateKey]) {
              sendSyntheticKey('keyup', outputKeyInfo);
              activePadState[stateKey] = false;
            }
          };

          handleDirection('d_left',  dLeft,  keyMap.ArrowLeft);
          handleDirection('d_right', dRight, keyMap.ArrowRight);
          handleDirection('d_up',    dUp,    keyMap.ArrowUp);
          handleDirection('d_down',  dDown,  keyMap.ArrowDown);

          Object.keys(controllerBinds).forEach(bIdx => {
            const pressed = gp.buttons[bIdx] && gp.buttons[bIdx].pressed;
            if (pressed && !activePadState[bIdx]) {
              sendSyntheticKey('keydown', controllerBinds[bIdx]);
              activePadState[bIdx] = true;
            } else if (!pressed && activePadState[bIdx]) {
              sendSyntheticKey('keyup', controllerBinds[bIdx]);
              activePadState[bIdx] = false;
            }
          });

        } else {
          padStatus.textContent = "No controller detected. Press any button on controller.";
        }

        requestAnimationFrame(gameLoop);
      }

      requestAnimationFrame(gameLoop);
    });
  </script>
</body>
</html>
