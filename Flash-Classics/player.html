<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Flash Player</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: radial-gradient(circle at center, #1e293b 0%, #050811 100%) !important;
      background-attachment: fixed !important;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      padding: 0.4rem 0.8rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: 0.35rem;
    }

    .header-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      flex-shrink: 0;
      z-index: 60;
    }

    .header-top {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      width: 100%;
    }

    .back-btn {
      color: #f8fafc;
      text-decoration: none;
      background-color: rgba(30, 41, 59, 0.9);
      backdrop-filter: blur(8px);
      padding: 0.3rem 0.6rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: background-color 0.2s, color 0.2s;
      justify-self: start;
    }

    .back-btn:hover {
      background-color: #334155;
      color: #38bdf8;
    }

    h1.game-title {
      grid-column: 2;
      text-align: center;
      font-size: 1.05rem;
      font-weight: 800;
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #ffffff 0%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      pointer-events: none;
    }

    .header-controls {
      display: flex;
      justify-content: center;
      gap: 6px;
      width: 100%;
    }

    .player-wrapper {
      position: relative;
      width: 100%;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden !important;
      outline: none;
      min-height: 0;
    }

    /* Screen perspective holder (handles CRT tilt & curvature bezel without breaking internal UI) */
    .screen-perspective {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      transition: transform 0.3s ease;
    }

    body.fx-curvature .screen-perspective {
      transform: perspective(900px) rotateX(1.5deg);
    }

    .game-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden !important;
      background: transparent !important;
      border-radius: 6px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    body.fx-curvature .game-container {
      border-radius: 20px;
    }

    body.fx-curvature .game-container::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 106;
      background: radial-gradient(circle at center, transparent 55%, rgba(0, 0, 0, 0.85) 100%);
      border-radius: inherit;
    }

    ruffle-player {
      width: 100% !important;
      height: 100% !important;
      display: block !important;
      background: transparent !important;
      overflow: hidden !important;
    }

    ruffle-player::part(container),
    ruffle-player::part(canvas) {
      width: 100% !important;
      height: 100% !important;
      background: transparent !important;
      object-fit: contain !important;
    }

    /* Dynamic Live CRT Overlays (Restricted precisely to the screen canvas area) */
    .retro-crt-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 85;
      display: none;
      border-radius: inherit;
      overflow: hidden;
    }

    @keyframes crt-roll {
      0% { background-position: 0 0; }
      100% { background-position: 0 12px; }
    }

    @keyframes crt-flicker {
      0% { opacity: 0.97; }
      50% { opacity: 1; }
      100% { opacity: 0.96; }
    }

    body.fx-scanlines .retro-crt-overlay {
      display: block;
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%, 
        rgba(0, 0, 0, 0.45) 50%
      );
      background-size: 100% 4px;
      animation: crt-roll 0.8s linear infinite, crt-flicker 0.15s infinite;
    }

    .retro-crt-overlay::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(255,255,255,0) 0%,
        rgba(255,255,255,0.03) 50%,
        rgba(255,255,255,0) 100%
      );
      height: 40px;
      animation: scanbar 4s linear infinite;
      pointer-events: none;
    }

    @keyframes scanbar {
      0% { transform: translateY(-40px); }
      100% { transform: translateY(105%); }
    }

    body.fx-glow .game-container {
      filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.4));
    }

    /* Strict Fullscreen Consistency */
    :fullscreen {
      width: 100vw !important;
      height: 100vh !important;
      background: radial-gradient(circle at center, #1e293b 0%, #050811 100%) !important;
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: space-between !important;
      padding: 0.4rem 0.8rem !important;
    }

    ::backdrop {
      background: radial-gradient(circle at center, #1e293b 0%, #050811 100%) !important;
    }

    :fullscreen .player-wrapper {
      width: 100% !important;
      flex: 1 !important;
    }

    .control-hover-trigger {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 12px;
      z-index: 120;
    }

    .control-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      padding: 6px 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      transform: translateY(100%);
      transition: transform 0.25s ease-in-out;
      z-index: 130;
    }

    .control-hover-trigger:hover + .control-bar,
    .control-bar:hover,
    .control-bar.visible {
      transform: translateY(0);
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .control-btn {
      padding: 3px 8px;
      background-color: rgba(255, 255, 255, 0.05);
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.7rem;
      font-weight: 600;
      transition: background-color 0.2s, color 0.2s;
    }

    .control-btn:hover {
      background-color: #334155;
      color: #38bdf8;
    }

    .volume-slider {
      width: 60px;
      cursor: pointer;
      accent-color: #38bdf8;
    }

    body.ambient-mode {
      background: radial-gradient(circle at center, #070a12 0%, #000000 70%) !important;
    }
    body.ambient-mode .header-container,
    body.ambient-mode .control-bar {
      opacity: 0.2;
    }
    body.ambient-mode .header-container:hover,
    body.ambient-mode .control-bar:hover {
      opacity: 1;
    }

    .flash-overlay {
      position: absolute;
      inset: 0;
      background: white;
      opacity: 0;
      pointer-events: none;
      z-index: 140;
      transition: opacity 0.3s ease-out;
    }
    .flash-overlay.active {
      opacity: 0.7;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 8, 17, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      width: 90%;
      max-width: 500px;
      padding: 1.15rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.9);
      max-height: 85vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 0.4rem;
    }

    .modal-header h3 {
      margin: 0;
      color: #38bdf8;
      font-size: 0.95rem;
    }

    .close-modal-btn {
      background: transparent;
      border: none;
      color: #f8fafc;
      font-size: 1.2rem;
      cursor: pointer;
    }

    .bind-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 10px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      font-size: 0.8rem;
    }

    .bind-key {
      padding: 4px 10px;
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid #38bdf8;
      color: #38bdf8;
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.75rem;
      cursor: pointer;
      min-width: 100px;
      text-align: center;
    }

    .bind-key.listening {
      background: #38bdf8;
      color: #000;
    }

    body.theater-mode .header-container { display: none !important; }
    body.theater-mode .player-wrapper {
      max-width: 100vw !important;
      width: 100vw !important;
      height: 100vh !important;
      margin: 0 !important;
    }
  </style>

  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      "scale": "showAll",
      "letterbox": "on",
      "wmode": "transparent",
      "backgroundColor": null,
      "renderer": "canvas",
      "allowScriptAccess": true
    };
  </script>
</head>
<body>

  <div class="header-container">
    <div class="header-top">
      <a href="index.html" class="back-btn">&larr; Games List</a>
      <h1 class="game-title" id="display-title">Loading...</h1>
      <div style="width: 70px; visibility: hidden;"></div>
    </div>
    
    <div class="header-controls">
      <button class="control-btn" id="kb-btn">Keyboard Binds</button>
      <button class="control-btn" id="mapper-btn">Controller Binds</button>
    </div>
  </div>

  <div class="player-wrapper" id="player-wrapper" tabindex="0">
    <div class="screen-perspective" id="screen-perspective">
      <div class="game-container" id="game-container">
        <div class="flash-overlay" id="flash-overlay"></div>
        <div class="retro-crt-overlay"></div>
        
        <!-- Ruffle player is inserted here, keeping it safely isolated from control bars -->
      </div>
    </div>

    <div class="control-hover-trigger"></div>
    <div class="control-bar" id="control-bar">
      <div class="control-group">
        <button class="control-btn" id="play-pause-btn">Pause</button>
        <button class="control-btn" id="reload-btn">Restart</button>
        <input type="range" class="volume-slider" id="volume-slider" min="0" max="1" step="0.05" value="1" title="Volume">
      </div>
      <div class="control-group">
        <button class="control-btn" id="fx-modal-btn">Visual FX</button>
        <button class="control-btn" id="ambient-btn">Ambient</button>
        <button class="control-btn" id="shot-btn">Screenshot</button>
        <button class="control-btn" id="theater-btn">Theater</button>
        <button class="control-btn" id="fs-btn">Fullscreen</button>
      </div>
    </div>
  </div>

  <!-- FX Modal -->
  <div class="modal-overlay" id="fx-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Retro Shader Overlays</h3>
        <button class="close-modal-btn" id="close-fx">&times;</button>
      </div>
      <div class="bind-row">
        <span>CRT Scanlines Effect</span>
        <button class="bind-key" id="toggle-scanlines" style="background: rgba(30,41,59,0.9);">Disabled</button>
      </div>
      <div class="bind-row">
        <span>CRT Curved Screen Bezel</span>
        <button class="bind-key" id="toggle-curvature" style="background: rgba(30,41,59,0.9);">Disabled</button>
      </div>
      <div class="bind-row">
        <span>Phosphor Glow Filter</span>
        <button class="bind-key" id="toggle-glow" style="background: rgba(30,41,59,0.9);">Disabled</button>
      </div>
    </div>
  </div>

  <!-- Keyboard Binds Modal -->
  <div class="modal-overlay" id="kb-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Keyboard Binds</h3>
        <button class="close-modal-btn" id="close-kb">&times;</button>
      </div>
      <div class="bind-row"><span>Left Arrow</span><button class="bind-key kb-bind" data-target="ArrowLeft">ArrowLeft</button></div>
      <div class="bind-row"><span>Right Arrow</span><button class="bind-key kb-bind" data-target="ArrowRight">ArrowRight</button></div>
      <div class="bind-row"><span>Up Arrow</span><button class="bind-key kb-bind" data-target="ArrowUp">ArrowUp</button></div>
      <div class="bind-row"><span>Down Arrow</span><button class="bind-key kb-bind" data-target="ArrowDown">ArrowDown</button></div>
      <div class="bind-row"><span>Key 'A'</span><button class="bind-key kb-bind" data-target="KeyA">A</button></div>
      <div class="bind-row"><span>Key 'S'</span><button class="bind-key kb-bind" data-target="KeyS">S</button></div>
      <div class="bind-row"><span>Key 'D'</span><button class="bind-key kb-bind" data-target="KeyD">D</button></div>
      <div class="bind-row"><span>Spacebar</span><button class="bind-key kb-bind" data-target="Space">Space</button></div>
    </div>
  </div>

  <!-- Controller Binds Modal -->
  <div class="modal-overlay" id="mapper-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Controller Binds</h3>
        <button class="close-modal-btn" id="close-mapper">&times;</button>
      </div>
      <p style="font-size: 0.75rem; color: #38bdf8; margin: 0;" id="pad-status">Searching for controller...</p>
      <div class="bind-row"><span>Button A</span><button class="bind-key pad-bind" data-pad-btn="0">A</button></div>
      <div class="bind-row"><span>Button B</span><button class="bind-key pad-bind" data-pad-btn="1">S</button></div>
      <div class="bind-row"><span>Button X</span><button class="bind-key pad-bind" data-pad-btn="2">A</button></div>
      <div class="bind-row"><span>Button Y</span><button class="bind-key pad-bind" data-pad-btn="3">D</button></div>
    </div>
  </div>

  <script>
    window.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const gameFile = urlParams.get("game") || "cactusmccoy.swf";
      const gameTitle = urlParams.get("title") || "Flash Game";

      document.getElementById("display-title").textContent = gameTitle;
      document.title = `${gameTitle} - Flash Player`;

      const gameContainer = document.getElementById("game-container");
      const wrapper = document.getElementById("player-wrapper");
      
      const ruffle = window.RufflePlayer.newest();
      const player = ruffle.createPlayer();
      gameContainer.insertBefore(player, gameContainer.firstChild);
      player.load(`assets/${gameFile}`);

      const fxModal = document.getElementById("fx-modal");
      const kbModal = document.getElementById("kb-modal");
      const mapperModal = document.getElementById("mapper-modal");
      const padStatus = document.getElementById("pad-status");
      const volumeSlider = document.getElementById("volume-slider");
      const ambientBtn = document.getElementById("ambient-btn");
      const shotBtn = document.getElementById("shot-btn");
      const flashOverlay = document.getElementById("flash-overlay");

      let activeListeningBtn = null;
      let listeningType = null;
      let isPaused = false;
      let scanlinesActive = false;
      let curvatureActive = false;
      let glowActive = false;

      function updateContainerAspect() {
        const wrapperWidth = wrapper.clientWidth;
        const wrapperHeight = wrapper.clientHeight;
        if (wrapperWidth === 0 || wrapperHeight === 0) return;

        const swfWidth = player.metadata?.width || 550;
        const swfHeight = player.metadata?.height || 400;
        const targetRatio = swfWidth / swfHeight;
        const wrapperRatio = wrapperWidth / wrapperHeight;

        if (wrapperRatio > targetRatio) {
          gameContainer.style.height = `${wrapperHeight}px`;
          gameContainer.style.width = `${wrapperHeight * targetRatio}px`;
        } else {
          gameContainer.style.width = `${wrapperWidth}px`;
          gameContainer.style.height = `${wrapperWidth / targetRatio}px`;
        }
      }

      window.addEventListener("resize", updateContainerAspect);
      document.addEventListener("fullscreenchange", () => {
        setTimeout(updateContainerAspect, 50);
        setTimeout(updateContainerAspect, 200);
      });
      
      setTimeout(updateContainerAspect, 100);
      setTimeout(updateContainerAspect, 500);
      setTimeout(updateContainerAspect, 1000);
      player.addEventListener("loadedmetadata", updateContainerAspect);

      document.getElementById("fx-modal-btn").onclick = () => fxModal.classList.add("open");
      document.getElementById("close-fx").onclick = () => { fxModal.classList.remove("open"); wrapper.focus(); };

      const toggleScanlinesBtn = document.getElementById("toggle-scanlines");
      toggleScanlinesBtn.onclick = () => {
        scanlinesActive = !scanlinesActive;
        document.body.classList.toggle("fx-scanlines", scanlinesActive);
        toggleScanlinesBtn.textContent = scanlinesActive ? "Enabled" : "Disabled";
      };

      const toggleCurvatureBtn = document.getElementById("toggle-curvature");
      toggleCurvatureBtn.onclick = () => {
        curvatureActive = !curvatureActive;
        document.body.classList.toggle("fx-curvature", curvatureActive);
        toggleCurvatureBtn.textContent = curvatureActive ? "Enabled" : "Disabled";
      };

      const toggleGlowBtn = document.getElementById("toggle-glow");
      toggleGlowBtn.onclick = () => {
        glowActive = !glowActive;
        document.body.classList.toggle("fx-glow", glowActive);
        toggleGlowBtn.textContent = glowActive ? "Enabled" : "Disabled";
      };

      ambientBtn.addEventListener("click", () => {
        document.body.classList.toggle("ambient-mode");
      });

      shotBtn.addEventListener("click", () => {
        let canvas = player.shadowRoot ? player.shadowRoot.querySelector("canvas") : player.querySelector("canvas");
        if (!canvas) return;
        flashOverlay.classList.add("active");
        setTimeout(() => flashOverlay.classList.remove("active"), 300);
        try {
          const link = document.createElement("a");
          link.download = `${gameTitle.replace(/[^a-z0-9]/gi, '_').toLowerCase()}_snapshot.png`;
          link.href = canvas.toDataURL("image/png");
          link.click();
        } catch (err) { console.error(err); }
      });

      const defaultKeyMap = {
        ArrowLeft:  { key: "ArrowLeft",  code: "ArrowLeft",  keyCode: 37 },
        ArrowRight: { key: "ArrowRight", code: "ArrowRight", keyCode: 39 },
        ArrowUp:    { key: "ArrowUp",    code: "ArrowUp",    keyCode: 38 },
        ArrowDown:  { key: "ArrowDown",  code: "ArrowDown",  keyCode: 40 },
        KeyA:       { key: "a",          code: "KeyA",       keyCode: 65 },
        KeyS:       { key: "s",          code: "KeyS",       keyCode: 83 },
        KeyD:       { key: "d",          code: "KeyD",       keyCode: 68 },
        Space:      { key: " ",          code: "Space",      keyCode: 32 }
      };

      const keyMap = JSON.parse(localStorage.getItem("flash_key_map") || JSON.stringify(defaultKeyMap));
      const controllerBinds = JSON.parse(localStorage.getItem("flash_pad_map") || JSON.stringify({
        0: keyMap.KeyA, 1: keyMap.KeyS, 2: keyMap.KeyA, 3: keyMap.KeyD
      }));
      const activePadState = {};

      function saveBindings() {
        localStorage.setItem("flash_key_map", JSON.stringify(keyMap));
        localStorage.setItem("flash_pad_map", JSON.stringify(controllerBinds));
      }

      document.getElementById("fs-btn").addEventListener("click", () => {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
      });

      document.getElementById("theater-btn").addEventListener("click", () => {
        document.body.classList.toggle("theater-mode");
        setTimeout(updateContainerAspect, 200);
      });

      document.getElementById("play-pause-btn").addEventListener("click", (e) => {
        if (!player) return;
        if (isPaused) { if (player.play) player.play(); e.target.textContent = "Pause"; } 
        else { if (player.pause) player.pause(); e.target.textContent = "Play"; }
        isPaused = !isPaused;
      });

      document.getElementById("reload-btn").addEventListener("click", () => {
        if (player && player.reload) player.reload();
      });

      volumeSlider.addEventListener("input", (e) => {
        if (player) {
          const val = parseFloat(e.target.value);
          if (player.setVolume) player.setVolume(val); else player.volume = val;
        }
      });

      document.getElementById("kb-btn").onclick = () => kbModal.classList.add("open");
      document.getElementById("close-kb").onclick = () => { kbModal.classList.remove("open"); wrapper.focus(); };
      document.getElementById("mapper-btn").onclick = () => mapperModal.classList.add("open");
      document.getElementById("close-mapper").onclick = () => { mapperModal.classList.remove("open"); wrapper.focus(); };

      document.querySelectorAll(".bind-key").forEach(btn => {
        if (btn.id.startsWith("toggle-")) return;
        btn.addEventListener("click", (e) => {
          if (activeListeningBtn) activeListeningBtn.classList.remove("listening");
          activeListeningBtn = e.target;
          listeningType = btn.classList.contains("kb-bind") ? "kb" : "pad";
          activeListeningBtn.classList.add("listening");
          activeListeningBtn.textContent = "Press Key...";
        });
      });

      window.addEventListener("keydown", (e) => {
        if (!activeListeningBtn) return;
        e.preventDefault();
        const label = e.key === " " ? "Space" : (e.key.length === 1 ? e.key.toUpperCase() : e.key);
        if (listeningType === "kb") {
          keyMap[activeListeningBtn.getAttribute("data-target")] = { key: e.key, code: e.code, keyCode: e.keyCode };
        } else {
          controllerBinds[activeListeningBtn.getAttribute("data-pad-btn")] = { key: e.key, code: e.code, keyCode: e.keyCode };
        }
        saveBindings();
        activeListeningBtn.textContent = label;
        activeListeningBtn.classList.remove("listening");
        activeListeningBtn = null;
      });

      function sendSyntheticKey(type, info) {
        if (!player || !info) return;
        player.dispatchEvent(new KeyboardEvent(type, { key: info.key, code: info.code, keyCode: info.keyCode, bubbles: true }));
      }

      function gameLoop() {
        const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
        const gp = gamepads[0] || gamepads[1];
        if (gp) {
          padStatus.textContent = `Connected: ${gp.id.substring(0, 25)}`;
          const axisX = gp.axes[0], axisY = gp.axes[1];
          const dLeft = gp.buttons[14]?.pressed || axisX < -0.5;
          const dRight = gp.buttons[15]?.pressed || axisX > 0.5;
          const dUp = gp.buttons[12]?.pressed || axisY < -0.5;
          const dDown = gp.buttons[13]?.pressed || axisY > 1.0;

          const checkDir = (key, pressed, info) => {
            if (pressed && !activePadState[key]) { sendSyntheticKey('keydown', info); activePadState[key] = true; }
            else if (!pressed && activePadState[key]) { sendSyntheticKey('keyup', info); activePadState[key] = false; }
          };
          checkDir('d_l', dLeft, keyMap.ArrowLeft);
          checkDir('d_r', dRight, keyMap.ArrowRight);
          checkDir('d_u', dUp, keyMap.ArrowUp);
          checkDir('d_d', dDown, keyMap.ArrowDown);

          Object.keys(controllerBinds).forEach(idx => {
            const pressed = gp.buttons[idx]?.pressed;
            if (pressed && !activePadState[idx]) { sendSyntheticKey('keydown', controllerBinds[idx]); activePadState[idx] = true; }
            else if (!pressed && activePadState[idx]) { sendSyntheticKey('keyup', controllerBinds[idx]); activePadState[idx] = false; }
          });
        }
        requestAnimationFrame(gameLoop);
      }
      requestAnimationFrame(gameLoop);
    });
  </script>
</body>
