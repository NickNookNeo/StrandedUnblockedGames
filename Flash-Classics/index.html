<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flash Games Library</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    :root {
      --bg-gradient: radial-gradient(circle at center, #1e293b 0%, #050811 100%);
      --card-bg: rgba(30, 41, 59, 0.9);
      --card-hover: #334155;
      --text-color: #f8fafc;
      --accent-color: #38bdf8;
      --border-color: rgba(255, 255, 255, 0.1);
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      margin-bottom: 2rem;
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      margin: 0 0 0.5rem 0;
      background: linear-gradient(135deg, #ffffff 0%, var(--accent-color) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    p.subtitle {
      color: #94a3b8;
      margin: 0;
      font-size: 0.95rem;
    }

    .grid {
      width: 100%;
      max-width: 1200px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
    }

    .game-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      text-decoration: none;
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, background-color 0.2s ease, border-color 0.2s ease;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
    }

    .game-card:hover {
      transform: translateY(-4px);
      background-color: var(--card-hover);
      border-color: var(--accent-color);
    }

    .card-image {
      width: 100%;
      height: 150px;
      background-color: #0f172a;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .game-card:hover .card-image img {
      transform: scale(1.05);
    }

    .card-content {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .card-content h3 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 700;
    }

    .loading-text, .error-text {
      grid-column: 1 / -1;
      text-align: center;
      color: #94a3b8;
      font-size: 1.1rem;
      padding: 3rem 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>Flash Game Library</h1>
    <p class="subtitle">Select a game below to start playing</p>
  </header>

  <div id="game-grid" class="grid">
    <div class="loading-text">Loading games library...</div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const gridContainer = document.getElementById("game-grid");

      fetch("games.json")
        .then(response => {
          if (!response.ok) throw new Error("Failed to load games.json");
          return response.json();
        })
        .then(games => {
          gridContainer.innerHTML = ""; // Clear loader
          
          if (games.length === 0) {
            gridContainer.innerHTML = '<div class="error-text">No games found in games.json.</div>';
            return;
          }

          games.forEach(game => {
            const card = document.createElement("a");
            card.href = `player.html?game=${encodeURIComponent(game.file)}&title=${encodeURIComponent(game.title)}`;
            card.className = "game-card";
            
            card.innerHTML = `
              <div class="card-image">
                <img src="assets/${game.thumbnail || 'default.jpg'}" alt="${game.title}" loading="lazy">
              </div>
              <div class="card-content">
                <h3>${game.title}</h3>
              </div>
            `;
            
            gridContainer.appendChild(card);
          });
        })
        .catch(error => {
          console.error("Error loading games list:", error);
          gridContainer.innerHTML = '<div class="error-text">Failed to load games list. Check console for details.</div>';
        });
    });
  </script>
</body>
</html>
