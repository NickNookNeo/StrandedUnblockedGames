<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flash Games Library</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    :root {
      --bg-gradient: radial-gradient(circle at center, #1e293b 0%, #050811 100%);
      --card-bg: rgba(30, 41, 59, 0.9);
      --card-hover: #334155;
      --text-color: #f8fafc;
      --accent-color: #38bdf8;
      --border-color: rgba(255, 255, 255, 0.1);
      --fav-color: #f43f5e;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      scroll-behavior: smooth;
    }

    body {
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      margin-bottom: 2rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 1200px;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      margin: 0 0 0.5rem 0;
      background: linear-gradient(135deg, #ffffff 0%, var(--accent-color) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    p.subtitle {
      color: #94a3b8;
      margin: 0 0 1rem 0;
      font-size: 0.95rem;
    }

    .controls-row {
      display: flex;
      gap: 1rem;
      width: 100%;
      max-width: 700px;
      margin-bottom: 1rem;
      justify-content: center;
      flex-wrap: wrap;
      position: relative;
    }

    .search-wrapper {
      flex: 1;
      min-width: 250px;
      position: relative;
    }

    #search-input {
      width: 100%;
      padding: 0.75rem 1rem;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-color);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    #search-input:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }

    .autocomplete-dropdown {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      z-index: 100;
      display: none;
      max-height: 200px;
      overflow-y: auto;
    }

    .autocomplete-item {
      padding: 0.6rem 1rem;
      font-size: 0.9rem;
      color: #cbd5e1;
      cursor: pointer;
      text-align: left;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      transition: background 0.15s, color 0.15s;
    }

    .autocomplete-item:last-child {
      border-bottom: none;
    }

    .autocomplete-item:hover {
      background: var(--card-hover);
      color: var(--accent-color);
    }

    .nav-tabs {
      display: flex;
      gap: 0.5rem;
    }

    .back-to-hub {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 200;
      color: #f8fafc;
      text-decoration: none;
      background-color: rgba(30, 41, 59, 0.9);
      backdrop-filter: blur(8px);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: background-color 0.2s, color 0.2s;
    }

    .back-to-hub:hover {
      background-color: #334155;
      color: #38bdf8;
    }

    .tab-btn, .random-btn {
      padding: 0.75rem 1rem;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-color);
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: background-color 0.2s, border-color 0.2s, color 0.2s;
    }

    .tab-btn.active, .tab-btn:hover, .random-btn:hover {
      background-color: var(--card-hover);
      border-color: var(--accent-color);
      color: var(--accent-color);
    }

    .tags-container {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 1.5rem;
    }

    .tag-pill {
      flex: 0 0 auto;
      padding: 0.35rem 0.8rem;
      background-color: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      font-size: 0.8rem;
      color: #94a3b8;
      cursor: pointer;
      transition: background-color 0.2s, color 0.2s, border-color 0.2s;
      box-sizing: border-box;
      height: 31px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      font-weight: 400;
    }

    .tag-pill:hover {
      background-color: var(--card-hover);
      color: var(--text-color);
      border-color: var(--accent-color);
    }

    .tag-pill.active {
      background-color: var(--accent-color);
      color: #050811;
      border-color: var(--accent-color);
      font-weight: 600;
    }

    .section-title {
      width: 100%;
      max-width: 1200px;
      font-size: 1.2rem;
      font-weight: 700;
      margin: 1rem 0 0.5rem 0;
      color: var(--accent-color);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .grid {
      width: 100%;
      max-width: 1200px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .game-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      text-decoration: none;
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      position: relative;
      transition: transform 0.2s ease, background-color 0.2s ease, border-color 0.2s ease;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
    }

    .game-card:hover {
      transform: translateY(-4px);
      background-color: var(--card-hover);
      border-color: var(--accent-color);
    }

    .card-image-wrap {
      position: relative;
      width: 100%;
      height: 150px;
      background-color: #0f172a;
      overflow: hidden;
    }

    .card-image-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .game-card:hover .card-image-wrap img {
      transform: scale(1.05);
    }

    .fav-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid var(--border-color);
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #94a3b8;
      font-size: 1rem;
      transition: background 0.2s, color 0.2s;
      z-index: 2;
    }

    .fav-btn:hover {
      background: rgba(15, 23, 42, 0.95);
      color: var(--fav-color);
    }

    .fav-btn.is-fav {
      color: var(--fav-color);
    }

    .card-content {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .card-content h3 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 700;
    }

    .card-tags {
      display: flex;
      gap: 0.3rem;
      flex-wrap: wrap;
    }

    .card-tag {
      font-size: 0.7rem;
      background: rgba(255, 255, 255, 0.05);
      padding: 2px 6px;
      border-radius: 4px;
      color: #94a3b8;
    }

    .loading-text, .error-text {
      grid-column: 1 / -1;
      text-align: center;
      color: #94a3b8;
      font-size: 1.1rem;
      padding: 3rem 0;
    }

    /* Scroll to Top Button */
    .scroll-top-btn {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--accent-color);
      width: 45px;
      height: 45px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease, background-color 0.2s;
      z-index: 99;
    }

    .scroll-top-btn.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .scroll-top-btn:hover {
      background-color: var(--card-hover);
      transform: translateY(-3px);
    }
  </style>
</head>
<body>

  <header>
    <a href="../index.html" class="back-to-hub">&larr; Back to SUBG</a>
    <h1>Flash Game Library</h1>
    <p class="subtitle">Select a game below to start playing</p>
    
    <div class="controls-row">
      <div class="search-wrapper">
        <input type="text" id="search-input" placeholder="Search games..." autocomplete="off">
        <div class="autocomplete-dropdown" id="autocomplete-dropdown"></div>
      </div>
      <button class="random-btn" id="random-btn" title="Pick a random game">🎲 Random</button>
      <div class="nav-tabs">
        <button class="tab-btn active" data-tab="all">All</button>
        <button class="tab-btn" data-tab="favs">Favorites</button>
      </div>
    </div>

    <div class="tags-container" id="tags-container">
      <button class="tag-pill active" data-tag="all">All Tags</button>
    </div>
  </header>

  <div id="recent-section" style="width: 100%; max-width: 1200px; display: none;">
    <div class="section-title">⏱️ Recently Played</div>
    <div id="recent-grid" class="grid" style="margin-bottom: 2rem;"></div>
  </div>

  <div class="section-title" id="library-title">🎮 All Games</div>
  <div id="game-grid" class="grid">
    <div class="loading-text">Loading games library...</div>
  </div>

  <!-- Scroll to Top Button -->
  <button class="scroll-top-btn" id="scroll-top-btn" title="Scroll to top">↑</button>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const gridContainer = document.getElementById("game-grid");
      const recentGrid = document.getElementById("recent-grid");
      const recentSection = document.getElementById("recent-section");
      const searchInput = document.getElementById("search-input");
      const autocompleteDropdown = document.getElementById("autocomplete-dropdown");
      const tagsContainer = document.getElementById("tags-container");
      const randomBtn = document.getElementById("random-btn");
      const scrollTopBtn = document.getElementById("scroll-top-btn");
      
      let allGames = [];
      let currentFilterTab = "all";
      let currentTag = "all";
      
      const FAV_KEY = "flash_favorites";
      const HISTORY_KEY = "flash_history";

      function getFavorites() {
        try { return JSON.parse(localStorage.getItem(FAV_KEY)) || []; } catch(e) { return []; }
      }

      function toggleFavorite(file, e) {
        e.preventDefault();
        e.stopPropagation();
        let favs = getFavorites();
        if (favs.includes(file)) {
          favs = favs.filter(f => f !== file);
        } else {
          favs.push(file);
        }
        localStorage.setItem(FAV_KEY, JSON.stringify(favs));
        applyFilters();
      }

      function addToHistory(game) {
        let history = [];
        try { history = JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; } catch(e) {}
        history = history.filter(item => item.file !== game.file);
        history.unshift(game);
        if (history.length > 4) history.pop();
        localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
      }

      function renderCard(game, container) {
        const favs = getFavorites();
        const isFav = favs.includes(game.file);

        const card = document.createElement("a");
        const w = game.width ? `&w=${game.width}` : '';
        const h = game.height ? `&h=${game.height}` : '';
        card.href = `player.html?game=${encodeURIComponent(game.file)}&title=${encodeURIComponent(game.title)}${w}${h}`;
        card.className = "game-card";
        
        card.addEventListener("click", () => addToHistory(game));

        const tagsHtml = (game.tags || []).map(t => `<span class="card-tag">${t}</span>`).join("");

        card.innerHTML = `
          <div class="card-image-wrap">
            <button class="fav-btn ${isFav ? 'is-fav' : ''}" title="Favorite">
              ${isFav ? '❤️' : '🤍'}
            </button>
            <img src="assets/${game.thumbnail || 'default.jpg'}" alt="${game.title}" loading="lazy">
          </div>
          <div class="card-content">
            <h3>${game.title}</h3>
            <div class="card-tags">${tagsHtml}</div>
          </div>
        `;

        card.querySelector(".fav-btn").addEventListener("click", (e) => toggleFavorite(game.file, e));
        container.appendChild(card);
      }

      function renderRecent() {
        let history = [];
        try { history = JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; } catch(e) {}
        
        recentGrid.innerHTML = "";
        if (history.length > 0 && currentFilterTab === "all" && currentTag === "all" && !searchInput.value) {
          recentSection.style.display = "block";
          history.forEach(game => renderCard(game, recentGrid));
        } else {
          recentSection.style.display = "none";
        }
      }

      function renderTagsList(games) {
        const tagsSet = new Set();
        games.forEach(g => (g.tags || []).forEach(t => tagsSet.add(t)));
        
        tagsContainer.innerHTML = `<button class="tag-pill ${currentTag === 'all' ? 'active' : ''}" data-tag="all">All Tags</button>`;
        tagsSet.forEach(tag => {
          const btn = document.createElement("button");
          btn.className = `tag-pill ${currentTag === tag ? 'active' : ''}`;
          btn.setAttribute("data-tag", tag);
          btn.textContent = tag.toUpperCase();
          tagsContainer.appendChild(btn);
        });
      }

      function updateAutocomplete(query) {
        if (!query) {
          autocompleteDropdown.style.display = "none";
          autocompleteDropdown.innerHTML = "";
          return;
        }

        const matches = allGames.filter(g => g.title.toLowerCase().includes(query)).slice(0, 5);
        if (matches.length === 0) {
          autocompleteDropdown.style.display = "none";
          autocompleteDropdown.innerHTML = "";
          return;
        }

        autocompleteDropdown.innerHTML = "";
        matches.forEach(game => {
          const item = document.createElement("div");
          item.className = "autocomplete-item";
          item.textContent = game.title;
          item.addEventListener("click", () => {
            searchInput.value = game.title;
            autocompleteDropdown.style.display = "none";
            applyFilters();
          });
          autocompleteDropdown.appendChild(item);
        });
        autocompleteDropdown.style.display = "block";
      }

      function applyFilters() {
        const query = searchInput.value.toLowerCase().trim();
        const favs = getFavorites();

        updateAutocomplete(query);

        let filtered = allGames.filter(game => {
          if (currentFilterTab === "favs" && !favs.includes(game.file)) return false;
          if (currentTag !== "all" && (!(game.tags || []).includes(currentTag))) return false;
          if (query && !game.title.toLowerCase().includes(query)) return false;
          return true;
        });

        gridContainer.innerHTML = "";
        if (filtered.length === 0) {
          gridContainer.innerHTML = '<div class="error-text">No games found matching your criteria.</div>';
        } else {
          filtered.forEach(game => renderCard(game, gridContainer));
        }

        renderRecent();
      }

      randomBtn.addEventListener("click", () => {
        if (allGames.length === 0) return;
        const query = searchInput.value.toLowerCase().trim();
        const favs = getFavorites();

        let pool = allGames.filter(game => {
          if (currentFilterTab === "favs" && !favs.includes(game.file)) return false;
          if (currentTag !== "all" && (!(game.tags || []).includes(currentTag))) return false;
          if (query && !game.title.toLowerCase().includes(query)) return false;
          return true;
        });

        if (pool.length === 0) pool = allGames;

        const randomGame = pool[Math.floor(Math.random() * pool.length)];
        addToHistory(randomGame);
        const rw = randomGame.width ? `&w=${randomGame.width}` : '';
        const rh = randomGame.height ? `&h=${randomGame.height}` : '';
        window.location.href = `player.html?game=${encodeURIComponent(randomGame.file)}&title=${encodeURIComponent(randomGame.title)}${rw}${rh}`;
      });

      fetch("games.json")
        .then(response => {
          if (!response.ok) throw new Error("Failed to load games.json");
          return response.json();
        })
        .then(games => {
          allGames = games;
          renderTagsList(allGames);
          applyFilters();
        })
        .catch(error => {
          console.error("Error loading games list:", error);
          gridContainer.innerHTML = '<div class="error-text">Failed to load games list. Check console for details.</div>';
        });

      searchInput.addEventListener("input", applyFilters);

      // Hide autocomplete when clicking outside
      document.addEventListener("click", (e) => {
        if (!e.target.closest(".search-wrapper")) {
          autocompleteDropdown.style.display = "none";
        }
      });

      // Scroll to top visibility and action
      window.addEventListener("scroll", () => {
        if (window.scrollY > 300) {
          scrollTopBtn.classList.add("visible");
        } else {
          scrollTopBtn.classList.remove("visible");
        }
      });

      scrollTopBtn.addEventListener("click", () => {
        window.scrollTo({ top: 0, behavior: "smooth" });
      });

      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.addEventListener("click", (e) => {
          document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
          e.target.classList.add("active");
          currentFilterTab = e.target.getAttribute("data-tab");
          applyFilters();
        });
      });

      tagsContainer.addEventListener("click", (e) => {
        if (e.target.classList.contains("tag-pill")) {
          document.querySelectorAll(".tag-pill").forEach(p => p.classList.remove("active"));
          e.target.classList.add("active");
          currentTag = e.target.getAttribute("data-tag");
          applyFilters();
        }
      });
    });
  </script>
</body>
</html>
