<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cactus McCoy</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-hover: #334155;
      --text-color: #f8fafc;
      --accent-color: #38bdf8;
      --border-color: rgba(255, 255, 255, 0.1);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .header-container {
      width: 100%;
      max-width: 800px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
    }

    .back-btn {
      color: var(--text-color);
      text-decoration: none;
      background-color: var(--card-bg);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      border: 1px solid var(--border-color);
      transition: background-color 0.2s, transform 0.1s;
    }

    .back-btn:hover {
      background-color: var(--card-hover);
      color: var(--accent-color);
    }

    h1 {
      font-size: 2rem;
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--accent-color);
    }

    .player-wrapper {
      display: flex;
      flex-direction: column;
      width: fit-content;
      max-width: 95vw;
      background-color: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .player-container {
      width: 100%;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    #flash-container {
      width: 100%;
      height: 100%;
      display: block;
    }

    .control-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--card-bg);
      padding: 10px 16px;
      border-top: 1px solid var(--border-color);
      width: 100%;
    }

    .control-group {
      display: flex;
      gap: 10px;
    }

    .control-btn {
      padding: 8px 16px;
      background-color: var(--bg-color);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: background-color 0.2s, color 0.2s, transform 0.1s;
    }

    .control-btn:hover {
      background-color: var(--card-hover);
      color: var(--accent-color);
    }

    .control-btn:active {
      transform: scale(0.95);
    }

    .player-wrapper:fullscreen {
      width: 100vw !important;
      height: 100vh !important;
      max-width: none !important;
      border-radius: 0;
      border: none;
      justify-content: space-between;
    }

    .player-wrapper:fullscreen .player-container {
      flex: 1;
      height: calc(100vh - 53px) !important;
      width: 100% !important;
      aspect-ratio: auto !important;
    }
  </style>

  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      "clip": true,
      "scale": "showAll",
      "letterbox": "on"
    };
  </script>
</head>
<body>

  <div class="header-container" id="header">
    <a href="../index.html" class="back-btn">&larr; Games List</a>
    <h1>Cactus McCoy</h1>
    <div style="width: 100px;"></div> 
  </div>

  <div class="player-wrapper" id="player-wrapper">
    <div class="player-container" id="player-container">
      <object id="flash-container" type="application/x-shockwave-flash" data="cactusmccoy.swf">
        <p>Unable to load Flash content.</p>
      </object>
    </div>

    <div class="control-bar">
      <div class="control-group">
        <button class="control-btn" id="play-pause-btn">Pause</button>
        <button class="control-btn" id="reload-btn">Restart</button>
      </div>
      <div class="control-group">
        <button class="control-btn" id="fs-btn">Fullscreen</button>
      </div>
    </div>
  </div>

  <script>
    window.addEventListener("DOMContentLoaded", () => {
      const wrapper = document.getElementById("player-wrapper");
      const playerContainer = document.getElementById("player-container");
      const header = document.getElementById("header");
      const fsBtn = document.getElementById("fs-btn");
      const playPauseBtn = document.getElementById("play-pause-btn");
      const reloadBtn = document.getElementById("reload-btn");

      function getRufflePlayer() {
        const obj = document.getElementById("flash-container");
        if (obj && (typeof obj.pause === "function" || obj.metadata)) return obj;

        const ruffleTag = document.querySelector("ruffle-embed, ruffle-object, ruffle-player");
        if (ruffleTag) return ruffleTag;

        return null;
      }

      function applyDimensions(width, height) {
        if (!width || !height) return;
        
        playerContainer.style.aspectRatio = `${width} / ${height}`;
        wrapper.style.width = `${width}px`;
        header.style.maxWidth = `${width}px`;
      }

      const observer = new MutationObserver(() => {
        const player = getRufflePlayer();
        if (player) {
          player.addEventListener("loadedmetadata", () => {
            const meta = player.metadata || (player.ruffle && player.ruffle().metadata);
            if (meta) applyDimensions(meta.width, meta.height);
          });

          const meta = player.metadata || (player.ruffle && player.ruffle().metadata);
          if (meta) applyDimensions(meta.width, meta.height);
          
          observer.disconnect();
        }
      });

      observer.observe(document.body, { childList: true, subtree: true });

      function isPlayerPaused(player) {
        if (!player) return false;
        if (typeof player.isPlaying === "function") {
          return !player.isPlaying();
        }
        if (player.shadowRoot) {
          const overlay = player.shadowRoot.querySelector("#play-overlay");
          if (overlay && overlay.style.display !== "none" && overlay.style.display !== "") {
            return true;
          }
        }
        return false;
      }

      playPauseBtn.addEventListener("click", () => {
        const player = getRufflePlayer();
        if (!player) return;

        const paused = isPlayerPaused(player);

        if (paused) {
          if (typeof player.play === "function") player.play();
          playPauseBtn.textContent = "Pause";
        } else {
          if (typeof player.pause === "function") player.pause();
          playPauseBtn.textContent = "Play";
        }
      });

      reloadBtn.addEventListener("click", () => {
        const player = getRufflePlayer();
        if (!player) return;

        if (typeof player.reload === "function") {
          player.reload();
        } else {
          const container = document.getElementById("flash-container");
          if (container) {
            const currentData = container.getAttribute("data");
            container.setAttribute("data", "");
            setTimeout(() => container.setAttribute("data", currentData), 10);
          }
        }
        playPauseBtn.textContent = "Pause";
      });

      fsBtn.addEventListener("click", () => {
        if (!document.fullscreenElement) {
          if (wrapper.requestFullscreen) {
            wrapper.requestFullscreen();
          } else if (wrapper.webkitRequestFullscreen) {
            wrapper.webkitRequestFullscreen();
          } else if (wrapper.msRequestFullscreen) {
            wrapper.msRequestFullscreen();
          }
        } else {
          if (document.exitFullscreen) {
            document.exitFullscreen();
          }
        }
      });
    });
  </script>

</body>
</html>
