<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flash Game Player</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(30, 41, 59, 0.9);
      --card-hover: #334155;
      --text-color: #f8fafc;
      --accent-color: #38bdf8;
      --border-color: rgba(255, 255, 255, 0.1);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at center, #1e293b 0%, #050811 100%);
      background-attachment: fixed;
      color: var(--text-color);
      margin: 0;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      user-select: none;
      -webkit-user-select: none;
    }

    .header-container {
      width: 100%;
      max-width: 800px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      transition: max-width 0.3s ease;
    }

    .back-btn {
      color: var(--text-color);
      text-decoration: none;
      background-color: var(--card-bg);
      backdrop-filter: blur(8px);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      border: 1px solid var(--border-color);
      transition: background-color 0.2s, color 0.2s;
    }

    .back-btn:hover {
      background-color: var(--card-hover);
      color: var(--accent-color);
    }

    h1 {
      font-size: 2rem;
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--accent-color);
    }

    .player-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 800px;
      background: radial-gradient(circle at center, #1e293b 0%, #050811 100%);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
      transition: max-width 0.3s ease;
    }

    .player-container {
      width: 100%;
      height: 100%;
      aspect-ratio: 4 / 3;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    #flash-container, ruffle-embed, ruffle-object, ruffle-player {
      width: 100% !important;
      height: 100% !important;
      max-width: 100% !important;
      max-height: 100% !important;
      display: block;
      background: transparent !important;
    }

    .control-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      padding: 12px 20px;
      border-top: 1px solid var(--border-color);
      transform: translateY(100%);
      
      /* Exit timing: Smooth slide out */
      transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.1s;
      z-index: 30;
      pointer-events: none;
    }

    .control-bar.visible {
      transform: translateY(0);
      pointer-events: auto;
      
      /* Entrance timing: Requires hover at bottom edge before sliding in */
      transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.15s;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .control-btn {
      padding: 8px 16px;
      background-color: rgba(255, 255, 255, 0.05);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: background-color 0.2s, color 0.2s, transform 0.1s;
    }

    .control-btn:hover {
      background-color: var(--card-hover);
      color: var(--accent-color);
    }

    .control-btn:active {
      transform: scale(0.95);
    }

    .control-btn:focus {
      outline: none;
    }

    /* Fixed-Width Volume Control Container */
    .volume-container {
      display: flex;
      align-items: center;
      gap: 8px;
      background-color: rgba(255, 255, 255, 0.03);
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }

    /* Fixed size for the mute button so icon swaps don't stretch the layout */
    .mute-btn {
      width: 28px;
      height: 28px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 0.95rem;
      border-radius: 4px;
      transition: background-color 0.2s;
    }

    .mute-btn:hover {
      background-color: rgba(255, 255, 255, 0.08);
    }

    .volume-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 75px;
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.2);
      outline: none;
      cursor: pointer;
      transition: background 0.2s;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent-color);
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .volume-slider::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    .volume-slider::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border: none;
      border-radius: 50%;
      background: var(--accent-color);
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .player-wrapper:fullscreen {
      width: 100vw !important;
      height: 100vh !important;
      max-width: 100vw !important;
      max-height: 100vh !important;
      border-radius: 0 !important;
      border: none !important;
      margin: 0 !important;
      background: radial-gradient(circle at center, #1e293b 0%, #050811 100%) !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
    }

    .player-wrapper:fullscreen .player-container {
      max-width: 100vw !important;
      max-height: 100vh !important;
      width: auto !important;
      height: 100% !important;
      background: transparent !important;
    }

    .player-wrapper:fullscreen #flash-container,
    .player-wrapper:fullscreen ruffle-embed,
    .player-wrapper:fullscreen ruffle-object,
    .player-wrapper:fullscreen ruffle-player {
      background: transparent !important;
    }
  </style>

  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      "clip": true,
      "scale": "showAll",
      "letterbox": "off",
      "backgroundColor": null,
      "wmode": "transparent"
    };
  </script>
</head>
<body>

  <div class="header-container" id="header">
    <a href="../index.html" class="back-btn">&larr; Games List</a>
    <h1>Cactus McCoy</h1>
    <div style="width: 100px;"></div> 
  </div>

  <div class="player-wrapper" id="player-wrapper" tabindex="0">
    <div class="player-container" id="player-container">
      <object id="flash-container" type="application/x-shockwave-flash" data="cactusmccoy.swf">
        <p>Unable to load Flash content.</p>
      </object>
    </div>

    <div class="control-bar" id="control-bar">
      <div class="control-group">
        <button class="control-btn" id="play-pause-btn">Pause</button>
        <button class="control-btn" id="reload-btn">Restart</button>
        
        <div class="volume-container">
          <button class="mute-btn" id="mute-btn" aria-label="Mute Volume">🔊</button>
          <input type="range" class="volume-slider" id="volume-slider" min="0" max="1" step="0.05" value="1">
        </div>
      </div>
      
      <div class="control-group">
        <button class="control-btn" id="fs-btn">Fullscreen</button>
      </div>
    </div>
  </div>

  <script>
    window.addEventListener("DOMContentLoaded", () => {
      const wrapper = document.getElementById("player-wrapper");
      const playerContainer = document.getElementById("player-container");
      const controlBar = document.getElementById("control-bar");
      const fsBtn = document.getElementById("fs-btn");
      const playPauseBtn = document.getElementById("play-pause-btn");
      const reloadBtn = document.getElementById("reload-btn");
      
      const muteBtn = document.getElementById("mute-btn");
      const volumeSlider = document.getElementById("volume-slider");

      let isPaused = false;
      let isRatioApplied = false;
      let previousVolume = 1;

      function getRufflePlayer() {
        const obj = document.getElementById("flash-container");
        if (obj && (typeof obj.pause === "function" || obj.metadata || obj.shadowRoot)) return obj;

        const ruffleTag = document.querySelector("ruffle-embed, ruffle-object, ruffle-player");
        if (ruffleTag) return ruffleTag;

        return null;
      }

      function setDynamicAspectRatio(width, height) {
        if (!width || !height || isRatioApplied) return;
        
        playerContainer.style.aspectRatio = `${width} / ${height}`;
        isRatioApplied = true;
      }

      const checkMetadata = () => {
        const player = getRufflePlayer();
        if (player) {
          const meta = player.metadata || (player.ruffle && player.ruffle().metadata);
          if (meta && meta.width && meta.height) {
            setDynamicAspectRatio(meta.width, meta.height);
          } else if (typeof player.addEventListener === "function") {
            player.addEventListener("loadedmetadata", () => {
              const loadedMeta = player.metadata || (player.ruffle && player.ruffle().metadata);
              if (loadedMeta) setDynamicAspectRatio(loadedMeta.width, loadedMeta.height);
            });
          }
        }
      };

      const metaInterval = setInterval(() => {
        checkMetadata();
        if (isRatioApplied) clearInterval(metaInterval);
      }, 100);

      setTimeout(() => clearInterval(metaInterval), 5000);

      function toggleFullscreen() {
        if (!document.fullscreenElement) {
          if (wrapper.requestFullscreen) {
            wrapper.requestFullscreen();
          } else if (wrapper.webkitRequestFullscreen) {
            wrapper.webkitRequestFullscreen();
          } else if (wrapper.msRequestFullscreen) {
            wrapper.msRequestFullscreen();
          }
        } else {
          if (document.exitFullscreen) {
            document.exitFullscreen();
          }
        }
      }

      function updateVolume(val) {
        const player = getRufflePlayer();
        if (player) {
          player.volume = val;
        }
        volumeSlider.value = val;

        if (val == 0) {
          muteBtn.textContent = "🔇";
        } else if (val < 0.5) {
          muteBtn.textContent = "🔉";
        } else {
          muteBtn.textContent = "🔊";
        }
      }

      volumeSlider.addEventListener("input", (e) => {
        const val = parseFloat(e.target.value);
        updateVolume(val);
        if (val > 0) previousVolume = val;
      });

      muteBtn.addEventListener("click", () => {
        muteBtn.blur();
        if (volumeSlider.value > 0) {
          previousVolume = volumeSlider.value;
          updateVolume(0);
        } else {
          updateVolume(previousVolume || 1);
        }
      });

      document.addEventListener("mousemove", (e) => {
        const wrapperBounds = wrapper.getBoundingClientRect();
        const barBounds = controlBar.getBoundingClientRect();
        const triggerZoneHeight = 10;

        const distanceToBottom = wrapperBounds.bottom - e.clientY;
        const isXInside = e.clientX >= wrapperBounds.left && e.clientX <= wrapperBounds.right;
        
        const isHoveringBar = e.clientX >= barBounds.left && e.clientX <= barBounds.right &&
                              e.clientY >= barBounds.top && e.clientY <= barBounds.bottom;

        if ((isXInside && distanceToBottom >= 0 && distanceToBottom <= triggerZoneHeight) || isHoveringBar) {
          controlBar.classList.add("visible");
        } else {
          controlBar.classList.remove("visible");
        }
      });

      wrapper.addEventListener("mouseleave", () => controlBar.classList.remove("visible"));
      window.addEventListener("mouseleave", () => controlBar.classList.remove("visible"));

      playerContainer.addEventListener("click", () => {
        if (isPaused) {
          isPaused = false;
          playPauseBtn.textContent = "Pause";
        }
      });

      playPauseBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        playPauseBtn.blur();
        const player = getRufflePlayer();
        if (!player) return;

        if (isPaused) {
          if (typeof player.play === "function") player.play();
          isPaused = false;
          playPauseBtn.textContent = "Pause";
        } else {
          if (typeof player.pause === "function") player.pause();
          isPaused = true;
          playPauseBtn.textContent = "Play";
        }
      });

      reloadBtn.addEventListener("click", () => {
        reloadBtn.blur();
        const player = getRufflePlayer();
        if (!player) return;

        if (typeof player.reload === "function") {
          player.reload();
        } else {
          const container = document.getElementById("flash-container");
          if (container) {
            const currentData = container.getAttribute("data");
            container.setAttribute("data", "");
            setTimeout(() => container.setAttribute("data", currentData), 10);
          }
        }
        isPaused = false;
        playPauseBtn.textContent = "Pause";
      });

      fsBtn.addEventListener("click", () => {
        fsBtn.blur();
        toggleFullscreen();
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "f" || e.key === "F") {
          if (document.activeElement.tagName !== "INPUT" && document.activeElement.tagName !== "TEXTAREA") {
            toggleFullscreen();
          }
        }
      });
    });
  </script>

</body>
</html>
