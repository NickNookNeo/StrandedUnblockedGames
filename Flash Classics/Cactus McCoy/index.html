<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flash Game Player</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    :root {
      --bg-gradient: radial-gradient(circle at center, #1e293b 0%, #050811 100%);
      --card-bg: rgba(30, 41, 59, 0.9);
      --card-hover: #334155;
      --text-color: #f8fafc;
      --accent-color: #38bdf8;
      --border-color: rgba(255, 255, 255, 0.1);
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: var(--bg-gradient) !important;
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      user-select: none;
    }

    body {
      padding: 0.75rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Header Container */
    .header-container {
      width: 100%;
      max-width: 1200px;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
      flex-shrink: 0;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      width: 100%;
    }

    .back-btn {
      color: var(--text-color);
      text-decoration: none;
      background-color: var(--card-bg);
      backdrop-filter: blur(8px);
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      border: 1px solid var(--border-color);
      transition: background-color 0.2s, color 0.2s;
    }

    .back-btn:hover {
      background-color: var(--card-hover);
      color: var(--accent-color);
    }

    h1.game-title {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.5rem;
      font-weight: 800;
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #ffffff 0%, var(--accent-color) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      pointer-events: none;
    }

    .header-controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      width: 100%;
    }

    /* Outer Stage Wrapper */
    .player-wrapper {
      position: relative;
      width: 100%;
      max-width: 1200px;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent !important;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
    }

    /* Force Ruffle Player to fill exact box and stay centered */
    ruffle-embed, ruffle-object, ruffle-player, #flash-container {
      width: 100% !important;
      height: 100% !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      background: transparent !important;
    }

    /* Auto-Hiding Control Bar */
    .control-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      padding: 10px 16px;
      border-top: 1px solid var(--border-color);
      transform: translateY(100%);
      transition: transform 0.2s ease-in-out;
      z-index: 50;
    }

    .control-bar.visible,
    .control-bar:hover {
      transform: translateY(0) !important;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .control-btn {
      padding: 6px 12px;
      background-color: rgba(255, 255, 255, 0.05);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      transition: background-color 0.2s, color 0.2s;
    }

    .control-btn:hover {
      background-color: var(--card-hover);
      color: var(--accent-color);
    }

    /* Modals */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 8, 17, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      width: 90%;
      max-width: 500px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.9);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.5rem;
    }

    .modal-header h3 {
      margin: 0;
      color: var(--accent-color);
    }

    .close-modal-btn {
      background: transparent;
      border: none;
      color: var(--text-color);
      font-size: 1.4rem;
      cursor: pointer;
    }

    .bind-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: 6px;
    }

    .bind-key {
      padding: 5px 12px;
      background: var(--card-bg);
      border: 1px solid var(--accent-color);
      color: var(--accent-color);
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .bind-key.listening {
      background: var(--accent-color);
      color: #000;
    }

    /* Theater / Fullscreen */
    body.theater-mode .header-container { display: none !important; }
    body.theater-mode .player-wrapper {
      max-width: 100vw !important;
      width: 100vw !important;
      height: 100vh !important;
      border-radius: 0 !important;
      border: none !important;
    }
  </style>

  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
  <script>
    // Config tuned to force scale-to-fit without pushing SWF past container bounds
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      "scale": "showAll",
      "forceScale": false,
      "letterbox": "on"
    };
  </script>
</head>
<body>

  <div class="header-container">
    <div class="header-top">
      <a href="../index.html" class="back-btn">&larr; Games List</a>
      <h1 class="game-title">Cactus McCoy</h1>
      <div style="width: 100px;"></div>
    </div>
    
    <div class="header-controls">
      <button class="control-btn" id="kb-btn">Keyboard Binds</button>
      <button class="control-btn" id="mapper-btn">Controller Binds</button>
    </div>
  </div>

  <div class="player-wrapper" id="player-wrapper" tabindex="0">
    <object id="flash-container" type="application/x-shockwave-flash" data="cactusmccoy.swf">
      <param name="scale" value="showAll" />
      <p>Unable to load Flash content.</p>
    </object>

    <div class="control-bar" id="control-bar">
      <div class="control-group">
        <button class="control-btn" id="play-pause-btn">Pause</button>
        <button class="control-btn" id="reload-btn">Restart</button>
      </div>
      <div class="control-group">
        <button class="control-btn" id="theater-btn">Theater</button>
        <button class="control-btn" id="fs-btn">Fullscreen</button>
      </div>
    </div>
  </div>

  <!-- Keyboard Modal -->
  <div class="modal-overlay" id="kb-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Keyboard Mapping</h3>
        <button class="close-modal-btn" id="close-kb">&times;</button>
      </div>
      <div class="bind-row">
        <span>Move Left</span>
        <button class="bind-key" data-action="left">ArrowLeft</button>
      </div>
      <div class="bind-row">
        <span>Move Right</span>
        <button class="bind-key" data-action="right">ArrowRight</button>
      </div>
      <div class="bind-row">
        <span>Jump</span>
        <button class="bind-key" data-action="jump">A</button>
      </div>
      <div class="bind-row">
        <span>Attack</span>
        <button class="bind-key" data-action="attack">S</button>
      </div>
    </div>
  </div>

  <!-- Controller Modal -->
  <div class="modal-overlay" id="mapper-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Controller (XInput)</h3>
        <button class="close-modal-btn" id="close-mapper">&times;</button>
      </div>
      <p style="font-size: 0.8rem; color: #38bdf8; margin: 0;" id="pad-status">Searching for controller...</p>
      <div class="bind-row">
        <span>Button A (Jump)</span>
        <button class="bind-key" data-pad="0">Map Key</button>
      </div>
      <div class="bind-row">
        <span>Button X (Attack)</span>
        <button class="bind-key" data-pad="2">Map Key</button>
      </div>
    </div>
  </div>

  <script>
    window.addEventListener("DOMContentLoaded", () => {
      const wrapper = document.getElementById("player-wrapper");
      const controlBar = document.getElementById("control-bar");
      const kbModal = document.getElementById("kb-modal");
      const mapperModal = document.getElementById("mapper-modal");
      const padStatus = document.getElementById("pad-status");

      let activeListeningBtn = null;
      let isPaused = false;

      // Controller-to-Keyboard synthetic event bridge map
      const controllerBinds = {
        0: { key: "a", code: "KeyA", keyCode: 65 }, // Button A -> 'A'
        2: { key: "s", code: "KeyS", keyCode: 83 }  // Button X -> 'S'
      };
      const activePadState = {};

      // Control bar hover trigger
      let hideTimer;
      wrapper.addEventListener("mousemove", (e) => {
        const rect = wrapper.getBoundingClientRect();
        if (rect.bottom - e.clientY <= 60) {
          controlBar.classList.add("visible");
          clearTimeout(hideTimer);
          hideTimer = setTimeout(() => {
            if (!controlBar.matches(':hover')) controlBar.classList.remove("visible");
          }, 1500);
        }
      });
      wrapper.addEventListener("mouseleave", () => controlBar.classList.remove("visible"));

      // Fullscreen & Theater
      document.getElementById("fs-btn").addEventListener("click", () => {
        if (!document.fullscreenElement) wrapper.requestFullscreen();
        else document.exitFullscreen();
      });
      document.getElementById("theater-btn").addEventListener("click", () => {
        document.body.classList.toggle("theater-mode");
      });

      // Pause/Restart
      document.getElementById("play-pause-btn").addEventListener("click", (e) => {
        const player = document.querySelector("ruffle-embed, ruffle-object, ruffle-player, #flash-container");
        if (!player) return;
        if (isPaused) { player.play && player.play(); e.target.textContent = "Pause"; }
        else { player.pause && player.pause(); e.target.textContent = "Play"; }
        isPaused = !isPaused;
      });
      document.getElementById("reload-btn").addEventListener("click", () => {
        const player = document.querySelector("ruffle-embed, ruffle-object, ruffle-player, #flash-container");
        if (player && player.reload) player.reload();
      });

      // Modal Controls
      document.getElementById("kb-btn").onclick = () => kbModal.classList.add("open");
      document.getElementById("close-kb").onclick = () => kbModal.classList.remove("open");
      document.getElementById("mapper-btn").onclick = () => mapperModal.classList.add("open");
      document.getElementById("close-mapper").onclick = () => mapperModal.classList.remove("open");

      // Remapping button listener logic
      document.querySelectorAll(".bind-key").forEach(btn => {
        btn.addEventListener("click", (e) => {
          if (activeListeningBtn) activeListeningBtn.classList.remove("listening");
          activeListeningBtn = e.target;
          activeListeningBtn.classList.add("listening");
          activeListeningBtn.textContent = "Press Key...";
        });
      });

      window.addEventListener("keydown", (e) => {
        if (activeListeningBtn) {
          e.preventDefault();
          activeListeningBtn.textContent = e.key === " " ? "Space" : e.key;
          activeListeningBtn.classList.remove("listening");
          activeListeningBtn = null;
        }
      });

      // Gamepad polling engine (Synthesizes keys directly to Ruffle element)
      function sendSyntheticKey(type, keyInfo) {
        const target = document.querySelector("ruffle-embed, ruffle-object, ruffle-player, #flash-container");
        if (!target) return;
        target.dispatchEvent(new KeyboardEvent(type, {
          key: keyInfo.key,
          code: keyInfo.code,
          keyCode: keyInfo.keyCode,
          bubbles: true,
          cancelable: true
        }));
      }

      function gameLoop() {
        const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
        const gp = gamepads[0] || gamepads[1];

        if (gp) {
          padStatus.textContent = `Connected: ${gp.id.substring(0, 30)}...`;

          // Check Left Stick / D-Pad
          const axisX = gp.axes[0];
          const dLeft = (gp.buttons[14] && gp.buttons[14].pressed) || axisX < -0.5;
          const dRight = (gp.buttons[15] && gp.buttons[15].pressed) || axisX > 0.5;

          if (dLeft && !activePadState['left']) {
            sendSyntheticKey('keydown', { key: 'ArrowLeft', code: 'ArrowLeft', keyCode: 37 });
            activePadState['left'] = true;
          } else if (!dLeft && activePadState['left']) {
            sendSyntheticKey('keyup', { key: 'ArrowLeft', code: 'ArrowLeft', keyCode: 37 });
            activePadState['left'] = false;
          }

          if (dRight && !activePadState['right']) {
            sendSyntheticKey('keydown', { key: 'ArrowRight', code: 'ArrowRight', keyCode: 39 });
            activePadState['right'] = true;
          } else if (!dRight && activePadState['right']) {
            sendSyntheticKey('keyup', { key: 'ArrowRight', code: 'ArrowRight', keyCode: 39 });
            activePadState['right'] = false;
          }

          // Check mapped buttons
          Object.keys(controllerBinds).forEach(bIdx => {
            const pressed = gp.buttons[bIdx] && gp.buttons[bIdx].pressed;
            if (pressed && !activePadState[bIdx]) {
              sendSyntheticKey('keydown', controllerBinds[bIdx]);
              activePadState[bIdx] = true;
            } else if (!pressed && activePadState[bIdx]) {
              sendSyntheticKey('keyup', controllerBinds[bIdx]);
              activePadState[bIdx] = false;
            }
          });
        } else {
          padStatus.textContent = "No active gamepad detected. Press any controller button.";
        }
        requestAnimationFrame(gameLoop);
      }
      requestAnimationFrame(gameLoop);
    });
  </script>
</body>
</html>
