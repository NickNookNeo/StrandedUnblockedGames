<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flash Game Player</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(30, 41, 59, 0.9);
      --card-hover: #334155;
      --text-color: #f8fafc;
      --accent-color: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.35);
      --danger-color: #ef4444;
      --border-color: rgba(255, 255, 255, 0.1);
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at center, #1e293b 0%, #050811 100%);
      background-attachment: fixed;
      color: var(--text-color);
      padding: 0.75rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Header Layout */
    .header-container {
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
      flex-shrink: 0;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      width: 100%;
    }

    .back-btn {
      color: var(--text-color);
      text-decoration: none;
      background-color: var(--card-bg);
      backdrop-filter: blur(8px);
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      border: 1px solid var(--border-color);
      transition: background-color 0.2s, color 0.2s;
      z-index: 10;
    }

    .back-btn:hover {
      background-color: var(--card-hover);
      color: var(--accent-color);
    }

    h1.game-title {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.5rem;
      font-weight: 800;
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-align: center;
      white-space: nowrap;
      background: linear-gradient(135deg, #ffffff 0%, var(--accent-color) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 4px 20px var(--accent-glow);
      pointer-events: none;
    }

    .header-right-spacer {
      width: 100px;
    }

    .header-controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      width: 100%;
    }

    /* Player Wrapper & Ambient Background */
    .player-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 960px;
      flex: 1;
      min-height: 0;
      margin: 0 auto;
      background: radial-gradient(circle at center, #1e293b 0%, #050811 100%);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(56, 189, 248, 0.05);
    }

    .player-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    /* Ruffle Sizing Modes */
    .scale-fit ruffle-player,
    .scale-fit #flash-container {
      width: 100% !important;
      height: 100% !important;
    }

    .scale-stretch ruffle-player,
    .scale-stretch #flash-container {
      width: 100% !important;
      height: 100% !important;
    }

    /* Direct scale constraint prevents Original from collapsing to 0x0 */
    .scale-original ruffle-player,
    .scale-original #flash-container {
      width: 800px !important;
      height: 600px !important;
      max-width: 100% !important;
      max-height: 100% !important;
    }

    #flash-container, ruffle-embed, ruffle-object, ruffle-player {
      display: block !important;
    }

    .fps-counter {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--border-color);
      color: #38bdf8;
      font-family: monospace;
      font-weight: bold;
      font-size: 0.8rem;
      padding: 4px 8px;
      border-radius: 4px;
      pointer-events: none;
      z-index: 20;
      display: none;
    }

    .fps-counter.active {
      display: block;
    }

    /* Bottom Control Bar Fixes */
    .control-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      padding: 10px 16px;
      border-top: 1px solid var(--border-color);
      transform: translateY(100%);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 50;
      pointer-events: auto;
    }

    .control-bar.visible {
      transform: translateY(0);
    }

    /* Hover detection zone overlay at wrapper bottom */
    .hover-trigger-zone {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 40px;
      z-index: 40;
      pointer-events: auto;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .control-btn {
      padding: 6px 12px;
      background-color: rgba(255, 255, 255, 0.05);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      transition: background-color 0.2s, color 0.2s;
    }

    .control-btn:hover {
      background-color: var(--card-hover);
      color: var(--accent-color);
    }

    .volume-container {
      display: flex;
      align-items: center;
      gap: 6px;
      background-color: rgba(255, 255, 255, 0.03);
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }

    .mute-btn {
      width: 24px;
      height: 24px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .volume-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 65px;
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.2);
      outline: none;
      cursor: pointer;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent-color);
      cursor: pointer;
    }

    /* Fullscreen & Theater Overrides */
    .player-wrapper:fullscreen,
    .player-wrapper:-webkit-full-screen {
      width: 100vw !important;
      height: 100vh !important;
      max-width: 100vw !important;
      max-height: 100vh !important;
      border-radius: 0 !important;
      border: none !important;
      margin: 0 !important;
      padding: 0 !important;
      background: radial-gradient(circle at center, #1e293b 0%, #050811 100%) !important;
    }

    body.theater-mode {
      padding: 0 !important;
      overflow: hidden !important;
    }

    body.theater-mode .header-container {
      display: none !important;
    }

    body.theater-mode .player-wrapper {
      max-width: 100vw !important;
      width: 100vw !important;
      height: 100vh !important;
      border-radius: 0 !important;
      border: none !important;
    }
  </style>

  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      "scale": "showAll",
      "letterbox": "on",
      "forceScale": true,
      "forceAlign": true,
      "wmode": "opaque"
    };
  </script>
</head>
<body>

  <div class="header-container" id="header">
    <div class="header-top">
      <a href="../index.html" class="back-btn">&larr; Games List</a>
      <h1 class="game-title">Cactus McCoy</h1>
      <div class="header-right-spacer"></div>
    </div>
    
    <div class="header-controls">
      <button class="control-btn" id="scale-btn">Scale: Fit</button>
      <button class="control-btn" id="kb-btn">Keyboard Binds</button>
      <button class="control-btn" id="mapper-btn">Controller Binds</button>
    </div>
  </div>

  <div class="player-wrapper" id="player-wrapper" tabindex="0">
    <div class="fps-counter" id="fps-counter">FPS: 00</div>
    
    <div class="player-container scale-fit" id="player-container">
      <object id="flash-container" type="application/x-shockwave-flash" data="cactusmccoy.swf">
        <param name="scale" value="showAll" />
        <p>Unable to load Flash content.</p>
      </object>
    </div>

    <div class="hover-trigger-zone" id="hover-trigger-zone"></div>

    <div class="control-bar" id="control-bar">
      <div class="control-group">
        <button class="control-btn" id="play-pause-btn">Pause</button>
        <button class="control-btn" id="reload-btn">Restart</button>
        
        <div class="volume-container">
          <button class="mute-btn" id="mute-btn" aria-label="Mute Volume">🔊</button>
          <input type="range" class="volume-slider" id="volume-slider" min="0" max="1" step="0.05" value="1">
        </div>
      </div>
      
      <div class="control-group">
        <button class="control-btn" id="fps-btn">FPS</button>
        <button class="control-btn" id="theater-btn">Theater</button>
        <button class="control-btn" id="fs-btn">Fullscreen</button>
      </div>
    </div>
  </div>

  <script>
    window.addEventListener("DOMContentLoaded", () => {
      const wrapper = document.getElementById("player-wrapper");
      const playerContainer = document.getElementById("player-container");
      const controlBar = document.getElementById("control-bar");
      const hoverZone = document.getElementById("hover-trigger-zone");
      const fsBtn = document.getElementById("fs-btn");
      const theaterBtn = document.getElementById("theater-btn");
      const scaleBtn = document.getElementById("scale-btn");

      const scaleModes = [
        { name: "Scale: Fit", class: "scale-fit", scale: "showAll", letterbox: "on" },
        { name: "Scale: Stretch", class: "scale-stretch", scale: "exactFit", letterbox: "off" },
        { name: "Scale: Original", class: "scale-original", scale: "noScale", letterbox: "on" }
      ];
      let currentScaleIdx = 0;

      function getRufflePlayer() {
        const obj = document.getElementById("flash-container");
        if (obj && (typeof obj.pause === "function" || obj.metadata || obj.shadowRoot)) return obj;
        return document.querySelector("ruffle-embed, ruffle-object, ruffle-player");
      }

      function applyScaleMode(mode) {
        playerContainer.classList.remove("scale-fit", "scale-stretch", "scale-original");
        playerContainer.classList.add(mode.class);

        const player = getRufflePlayer();
        if (player) {
          if (!player.config) player.config = {};
          player.config.scale = mode.scale;
          player.config.letterbox = mode.letterbox;

          player.setAttribute("scale", mode.scale);
          player.setAttribute("letterbox", mode.letterbox);

          window.dispatchEvent(new Event("resize"));
        }
      }

      scaleBtn.addEventListener("click", () => {
        scaleBtn.blur();
        currentScaleIdx = (currentScaleIdx + 1) % scaleModes.length;
        const mode = scaleModes[currentScaleIdx];
        scaleBtn.textContent = mode.name;
        applyScaleMode(mode);
      });

      /* Reliable Hover Bar Triggering */
      let hideTimeout = null;

      function showControlBar() {
        if (hideTimeout) clearTimeout(hideTimeout);
        controlBar.classList.add("visible");
      }

      function hideControlBar() {
        hideTimeout = setTimeout(() => {
          controlBar.classList.remove("visible");
        }, 300);
      }

      hoverZone.addEventListener("mouseenter", showControlBar);
      controlBar.addEventListener("mouseenter", showControlBar);
      
      hoverZone.addEventListener("mouseleave", hideControlBar);
      controlBar.addEventListener("mouseleave", hideControlBar);

      wrapper.addEventListener("mousemove", (e) => {
        const rect = wrapper.getBoundingClientRect();
        if (e.clientY >= rect.bottom - 50) {
          showControlBar();
        }
      });

      function toggleFullscreen() {
        if (!document.fullscreenElement) {
          if (wrapper.requestFullscreen) {
            wrapper.requestFullscreen();
          }
        } else {
          if (document.exitFullscreen) {
            document.exitFullscreen();
          }
        }
      }

      fsBtn.addEventListener("click", () => {
        fsBtn.blur();
        toggleFullscreen();
      });

      theaterBtn.addEventListener("click", () => {
        theaterBtn.blur();
        document.body.classList.toggle("theater-mode");
        theaterBtn.style.color = document.body.classList.contains("theater-mode") ? "var(--accent-color)" : "var(--text-color)";
        setTimeout(() => {
          applyScaleMode(scaleModes[currentScaleIdx]);
        }, 50);
      });

      document.addEventListener("fullscreenchange", () => {
        setTimeout(() => {
          applyScaleMode(scaleModes[currentScaleIdx]);
        }, 100);
      });
    });
  </script>
</body>
</html>
