<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flash Game Player</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    :root {
      --bg-gradient: radial-gradient(circle at center, #1e293b 0%, #050811 100%);
      --card-bg: rgba(30, 41, 59, 0.9);
      --card-hover: #334155;
      --text-color: #f8fafc;
      --accent-color: #38bdf8;
      --border-color: rgba(255, 255, 255, 0.1);
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: var(--bg-gradient) !important;
      background-attachment: fixed !important;
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      user-select: none;
    }

    body {
      padding: 0.75rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Header Container */
    .header-container {
      width: 100%;
      max-width: 1200px;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
      flex-shrink: 0;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      width: 100%;
    }

    .back-btn {
      color: var(--text-color);
      text-decoration: none;
      background-color: var(--card-bg);
      backdrop-filter: blur(8px);
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      border: 1px solid var(--border-color);
      transition: background-color 0.2s, color 0.2s;
    }

    .back-btn:hover {
      background-color: var(--card-hover);
      color: var(--accent-color);
    }

    h1.game-title {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.5rem;
      font-weight: 800;
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #ffffff 0%, var(--accent-color) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      pointer-events: none;
    }

    .header-controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      width: 100%;
    }

    /* Outer Stage Wrapper */
    .player-wrapper {
      position: relative;
      width: 100%;
      max-width: 1200px;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent !important;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
    }

    /* Force Ruffle Elements Transparent to reveal global background */
    ruffle-embed, ruffle-object, ruffle-player, #flash-container {
      width: 100% !important;
      height: 100% !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      background: transparent !important;
    }

    /* Fullscreen Background Override */
    .player-wrapper:fullscreen,
    .player-wrapper:-webkit-full-screen {
      width: 100vw !important;
      height: 100vh !important;
      max-width: 100vw !important;
      max-height: 100vh !important;
      border-radius: 0 !important;
      border: none !important;
      background: var(--bg-gradient) !important;
    }

    /* Auto-Hiding Control Bar */
    .control-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      padding: 10px 16px;
      border-top: 1px solid var(--border-color);
      transform: translateY(100%);
      transition: transform 0.2s ease-in-out;
      z-index: 50;
    }

    .control-bar.visible,
    .control-bar:hover {
      transform: translateY(0) !important;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .control-btn {
      padding: 6px 12px;
      background-color: rgba(255, 255, 255, 0.05);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      transition: background-color 0.2s, color 0.2s;
    }

    .control-btn:hover {
      background-color: var(--card-hover);
      color: var(--accent-color);
    }

    /* Modals */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 8, 17, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      width: 90%;
      max-width: 520px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.9);
      max-height: 85vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.5rem;
    }

    .modal-header h3 {
      margin: 0;
      color: var(--accent-color);
    }

    .close-modal-btn {
      background: transparent;
      border: none;
      color: var(--text-color);
      font-size: 1.4rem;
      cursor: pointer;
    }

    .bind-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: 6px;
    }

    .bind-key {
      padding: 5px 12px;
      background: var(--card-bg);
      border: 1px solid var(--accent-color);
      color: var(--accent-color);
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.8rem;
      cursor: pointer;
      min-width: 100px;
      text-align: center;
    }

    .bind-key.listening {
      background: var(--accent-color);
      color: #000;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.6; }
      100% { opacity: 1; }
    }

    /* Theater / Fullscreen Mode */
    body.theater-mode .header-container { display: none !important; }
    body.theater-mode .player-wrapper {
      max-width: 100vw !important;
      width: 100vw !important;
      height: 100vh !important;
      border-radius: 0 !important;
      border: none !important;
    }
  </style>

  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      "scale": "showAll",
      "forceScale": false,
      "letterbox": "off"
    };
  </script>
</head>
<body>

  <div class="header-container">
    <div class="header-top">
      <a href="../index.html" class="back-btn">&larr; Games List</a>
      <h1 class="game-title">Cactus McCoy</h1>
      <div style="width: 100px;"></div>
    </div>
    
    <div class="header-controls">
      <button class="control-btn" id="kb-btn">Keyboard Binds</button>
      <button class="control-btn" id="mapper-btn">Controller Binds</button>
    </div>
  </div>

  <div class="player-wrapper" id="player-wrapper" tabindex="0">
    <object id="flash-container" type="application/x-shockwave-flash" data="cactusmccoy.swf">
      <param name="scale" value="showAll" />
      <p>Unable to load Flash content.</p>
    </object>

    <div class="control-bar" id="control-bar">
      <div class="control-group">
        <button class="control-btn" id="play-pause-btn">Pause</button>
        <button class="control-btn" id="reload-btn">Restart</button>
      </div>
      <div class="control-group">
        <button class="control-btn" id="theater-btn">Theater</button>
        <button class="control-btn" id="fs-btn">Fullscreen</button>
      </div>
    </div>
  </div>

  <!-- Keyboard Remapping Modal -->
  <div class="modal-overlay" id="kb-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Keyboard Mapping</h3>
        <button class="close-modal-btn" id="close-kb">&times;</button>
      </div>
      <div class="bind-row">
        <span>Move Left</span>
        <button class="bind-key kb-bind" data-action="left">ArrowLeft</button>
      </div>
      <div class="bind-row">
        <span>Move Right</span>
        <button class="bind-key kb-bind" data-action="right">ArrowRight</button>
      </div>
      <div class="bind-row">
        <span>Move Up</span>
        <button class="bind-key kb-bind" data-action="up">ArrowUp</button>
      </div>
      <div class="bind-row">
        <span>Move Down</span>
        <button class="bind-key kb-bind" data-action="down">ArrowDown</button>
      </div>
      <div class="bind-row">
        <span>Jump / Action 1</span>
        <button class="bind-key kb-bind" data-action="jump">a</button>
      </div>
      <div class="bind-row">
        <span>Attack / Action 2</span>
        <button class="bind-key kb-bind" data-action="attack">s</button>
      </div>
      <div class="bind-row">
        <span>Special / Action 3</span>
        <button class="bind-key kb-bind" data-action="special">d</button>
      </div>
    </div>
  </div>

  <!-- Controller Remapping Modal -->
  <div class="modal-overlay" id="mapper-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Controller Remapping</h3>
        <button class="close-modal-btn" id="close-mapper">&times;</button>
      </div>
      <p style="font-size: 0.8rem; color: #38bdf8; margin: 0;" id="pad-status">Searching for controller...</p>
      <div class="bind-row">
        <span>Button A (Bottom)</span>
        <button class="bind-key pad-bind" data-pad-btn="0">a</button>
      </div>
      <div class="bind-row">
        <span>Button B (Right)</span>
        <button class="bind-key pad-bind" data-pad-btn="1">s</button>
      </div>
      <div class="bind-row">
        <span>Button X (Left)</span>
        <button class="bind-key pad-bind" data-pad-btn="2">a</button>
      </div>
      <div class="bind-row">
        <span>Button Y (Top)</span>
        <button class="bind-key pad-bind" data-pad-btn="3">d</button>
      </div>
      <div class="bind-row">
        <span>Left Bumper (LB)</span>
        <button class="bind-key pad-bind" data-pad-btn="4">q</button>
      </div>
      <div class="bind-row">
        <span>Right Bumper (RB)</span>
        <button class="bind-key pad-bind" data-pad-btn="5">e</button>
      </div>
    </div>
  </div>

  <script>
    window.addEventListener("DOMContentLoaded", () => {
      const wrapper = document.getElementById("player-wrapper");
      const controlBar = document.getElementById("control-bar");
      const kbModal = document.getElementById("kb-modal");
      const mapperModal = document.getElementById("mapper-modal");
      const padStatus = document.getElementById("pad-status");

      let activeListeningBtn = null;
      let listeningType = null; // 'kb' or 'pad'
      let isPaused = false;

      // Active Key Map Definitions
      const kbMap = {
        left:    { key: "ArrowLeft",  code: "ArrowLeft",  keyCode: 37 },
        right:   { key: "ArrowRight", code: "ArrowRight", keyCode: 39 },
        up:      { key: "ArrowUp",    code: "ArrowUp",    keyCode: 38 },
        down:    { key: "ArrowDown",  code: "ArrowDown",  keyCode: 40 },
        jump:    { key: "a",          code: "KeyA",       keyCode: 65 },
        attack:  { key: "s",          code: "KeyS",       keyCode: 83 },
        special: { key: "d",          code: "KeyD",       keyCode: 68 }
      };

      const controllerBinds = {
        0: { key: "a", code: "KeyA", keyCode: 65 }, // Button A
        1: { key: "s", code: "KeyS", keyCode: 83 }, // Button B
        2: { key: "a", code: "KeyA", keyCode: 65 }, // Button X
        3: { key: "d", code: "KeyD", keyCode: 68 }, // Button Y
        4: { key: "q", code: "KeyQ", keyCode: 81 }, // LB
        5: { key: "e", code: "KeyE", keyCode: 69 }  // RB
      };

      const activePadState = {};

      // Get target Ruffle Element reliably
      function getPlayer() {
        return document.querySelector("ruffle-embed, ruffle-object, ruffle-player, #flash-container");
      }

      // Auto-Hiding Control Bar logic
      let hideTimer;
      wrapper.addEventListener("mousemove", (e) => {
        const rect = wrapper.getBoundingClientRect();
        if (rect.bottom - e.clientY <= 60) {
          controlBar.classList.add("visible");
          clearTimeout(hideTimer);
          hideTimer = setTimeout(() => {
            if (!controlBar.matches(':hover')) controlBar.classList.remove("visible");
          }, 1500);
        }
      });
      wrapper.addEventListener("mouseleave", () => controlBar.classList.remove("visible"));

      // Fullscreen & Theater Controls
      document.getElementById("fs-btn").addEventListener("click", () => {
        if (!document.fullscreenElement) wrapper.requestFullscreen();
        else document.exitFullscreen();
      });

      document.getElementById("theater-btn").addEventListener("click", () => {
        document.body.classList.toggle("theater-mode");
      });

      // Pause/Restart Buttons
      document.getElementById("play-pause-btn").addEventListener("click", (e) => {
        const player = getPlayer();
        if (!player) return;
        if (isPaused) { 
          if (typeof player.play === "function") player.play(); 
          e.target.textContent = "Pause"; 
        } else { 
          if (typeof player.pause === "function") player.pause(); 
          e.target.textContent = "Play"; 
        }
        isPaused = !isPaused;
      });

      document.getElementById("reload-btn").addEventListener("click", () => {
        const player = getPlayer();
        if (player && typeof player.reload === "function") {
          player.reload();
        } else if (player) {
          const currentData = player.getAttribute("data");
          player.setAttribute("data", "");
          setTimeout(() => player.setAttribute("data", currentData), 10);
        }
      });

      // Modal Toggles
      document.getElementById("kb-btn").onclick = () => kbModal.classList.add("open");
      document.getElementById("close-kb").onclick = () => kbModal.classList.remove("open");
      document.getElementById("mapper-btn").onclick = () => mapperModal.classList.add("open");
      document.getElementById("close-mapper").onclick = () => mapperModal.classList.remove("open");

      // Set key listening mode
      document.querySelectorAll(".bind-key").forEach(btn => {
        btn.addEventListener("click", (e) => {
          if (activeListeningBtn) activeListeningBtn.classList.remove("listening");
          activeListeningBtn = e.target;
          listeningType = btn.classList.contains("kb-bind") ? "kb" : "pad";
          activeListeningBtn.classList.add("listening");
          activeListeningBtn.textContent = "Press Key...";
        });
      });

      // Capture Keyboard inputs for remapping
      window.addEventListener("keydown", (e) => {
        if (!activeListeningBtn) return;

        e.preventDefault();
        const label = e.key === " " ? "Space" : e.key;

        if (listeningType === "kb") {
          const action = activeListeningBtn.getAttribute("data-action");
          kbMap[action] = { key: e.key, code: e.code, keyCode: e.keyCode };
          activeListeningBtn.textContent = label;
        } else if (listeningType === "pad") {
          const padIdx = activeListeningBtn.getAttribute("data-pad-btn");
          controllerBinds[padIdx] = { key: e.key, code: e.code, keyCode: e.keyCode };
          activeListeningBtn.textContent = label;
        }

        activeListeningBtn.classList.remove("listening");
        activeListeningBtn = null;
      });

      // Dispatch Synthetic Keyboard Event directly to Ruffle
      function sendSyntheticKey(type, keyInfo) {
        const target = getPlayer();
        if (!target) return;
        target.dispatchEvent(new KeyboardEvent(type, {
          key: keyInfo.key,
          code: keyInfo.code,
          keyCode: keyInfo.keyCode,
          bubbles: true,
          cancelable: true
        }));
      }

      // Main Gamepad Polling Loop
      function gameLoop() {
        const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
        const gp = gamepads[0] || gamepads[1] || gamepads[2] || gamepads[3];

        if (gp) {
          padStatus.textContent = `Connected: ${gp.id.substring(0, 32)}...`;

          // Check Axis & D-Pad inputs
          const axisX = gp.axes[0];
          const axisY = gp.axes[1];

          const dLeft  = (gp.buttons[14] && gp.buttons[14].pressed) || axisX < -0.5;
          const dRight = (gp.buttons[15] && gp.buttons[15].pressed) || axisX > 0.5;
          const dUp    = (gp.buttons[12] && gp.buttons[12].pressed) || axisY < -0.5;
          const dDown  = (gp.buttons[13] && gp.buttons[13].pressed) || axisY > 0.5;

          // Helper to process directional state toggles
          const checkDirection = (stateKey, isPressed, bindTarget) => {
            if (isPressed && !activePadState[stateKey]) {
              sendSyntheticKey('keydown', bindTarget);
              activePadState[stateKey] = true;
            } else if (!isPressed && activePadState[stateKey]) {
              sendSyntheticKey('keyup', bindTarget);
              activePadState[stateKey] = false;
            }
          };

          checkDirection('left',  dLeft,  kbMap.left);
          checkDirection('right', dRight, kbMap.right);
          checkDirection('up',    dUp,    kbMap.up);
          checkDirection('down',  dDown,  kbMap.down);

          // Dynamic Controller Button check loop
          Object.keys(controllerBinds).forEach(bIdx => {
            const pressed = gp.buttons[bIdx] && gp.buttons[bIdx].pressed;
            if (pressed && !activePadState[bIdx]) {
              sendSyntheticKey('keydown', controllerBinds[bIdx]);
              activePadState[bIdx] = true;
            } else if (!pressed && activePadState[bIdx]) {
              sendSyntheticKey('keyup', controllerBinds[bIdx]);
              activePadState[bIdx] = false;
            }
          });

        } else {
          padStatus.textContent = "No controller detected. Press any button on your gamepad.";
        }

        requestAnimationFrame(gameLoop);
      }

      requestAnimationFrame(gameLoop);
    });
  </script>
</body>
</html>
