<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flash Game Player</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(30, 41, 59, 0.9);
      --card-hover: #334155;
      --text-color: #f8fafc;
      --accent-color: #38bdf8;
      --border-color: rgba(255, 255, 255, 0.1);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at center, #1e293b 0%, #050811 100%);
      background-attachment: fixed;
      color: var(--text-color);
      margin: 0;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      user-select: none;
      -webkit-user-select: none;
    }

    .header-container {
      width: 100%;
      max-width: 800px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      transition: max-width 0.3s ease;
    }

    .back-btn {
      color: var(--text-color);
      text-decoration: none;
      background-color: var(--card-bg);
      backdrop-filter: blur(8px);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      border: 1px solid var(--border-color);
      transition: background-color 0.2s, transform 0.1s, color 0.2s;
    }

    .back-btn:hover {
      background-color: var(--card-hover);
      color: var(--accent-color);
    }

    h1 {
      font-size: 2rem;
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--accent-color);
    }

    .player-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 800px;
      background: radial-gradient(circle at center, #1e293b 0%, #050811 100%);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
      transition: max-width 0.3s ease;
    }

    .player-wrapper.hide-cursor {
      cursor: none;
    }

    .player-wrapper.hide-cursor * {
      cursor: none !important;
    }

    .player-container {
      width: 100%;
      aspect-ratio: 4 / 3;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    #flash-container, ruffle-embed, ruffle-object, ruffle-player {
      width: 100% !important;
      height: 100% !important;
      display: block;
      background: transparent !important;
    }

    .control-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      padding: 12px 20px;
      border-top: 1px solid var(--border-color);
      transform: translateY(100%);
      transition: transform 0.15s ease-out;
      z-index: 30;
      pointer-events: none;
    }

    .control-bar.visible {
      transform: translateY(0);
      pointer-events: auto;
    }

    .control-group {
      display: flex;
      gap: 10px;
    }

    .control-btn {
      padding: 8px 16px;
      background-color: rgba(255, 255, 255, 0.05);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: background-color 0.2s, color 0.2s, transform 0.1s, border-color 0.2s;
    }

    .control-btn:hover {
      background-color: var(--card-hover);
      color: var(--accent-color);
      border-color: rgba(56, 189, 248, 0.4);
    }

    .control-btn:active {
      transform: scale(0.95);
    }

    .control-btn:focus {
      outline: none;
    }

    .player-wrapper:fullscreen {
      width: 100vw !important;
      height: 100vh !important;
      max-width: 100vw !important;
      max-height: 100vh !important;
      border-radius: 0 !important;
      border: none !important;
      margin: 0 !important;
      background: radial-gradient(circle at center, #1e293b 0%, #050811 100%) !important;
    }

    .player-wrapper:fullscreen .player-container {
      width: 100vw !important;
      height: 100vh !important;
      aspect-ratio: auto !important;
      background: transparent !important;
    }

    .player-wrapper:fullscreen #flash-container,
    .player-wrapper:fullscreen ruffle-embed,
    .player-wrapper:fullscreen ruffle-object,
    .player-wrapper:fullscreen ruffle-player {
      width: 100vw !important;
      height: 100vh !important;
      background: transparent !important;
    }
  </style>

  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      "clip": true,
      "scale": "showAll",
      "letterbox": "off",
      "backgroundColor": null,
      "wmode": "transparent"
    };
  </script>
</head>
<body>

  <div class="header-container" id="header">
    <a href="../index.html" class="back-btn">&larr; Games List</a>
    <h1>Cactus McCoy</h1>
    <div style="width: 100px;"></div> 
  </div>

  <div class="player-wrapper" id="player-wrapper">
    <div class="player-container" id="player-container">
      <object id="flash-container" type="application/x-shockwave-flash" data="cactusmccoy.swf">
        <p>Unable to load Flash content.</p>
      </object>
    </div>

    <div class="control-bar" id="control-bar">
      <div class="control-group">
        <button class="control-btn" id="play-pause-btn">Pause</button>
        <button class="control-btn" id="reload-btn">Restart</button>
      </div>
      <div class="control-group">
        <button class="control-btn" id="fs-btn">Fullscreen</button>
      </div>
    </div>
  </div>

  <script>
    window.addEventListener("DOMContentLoaded", () => {
      const wrapper = document.getElementById("player-wrapper");
      const playerContainer = document.getElementById("player-container");
      const controlBar = document.getElementById("control-bar");
      const fsBtn = document.getElementById("fs-btn");
      const playPauseBtn = document.getElementById("play-pause-btn");
      const reloadBtn = document.getElementById("reload-btn");

      let isPaused = false;
      let hideTimeout = null;
      let cursorTimeout = null;
      let isRatioApplied = false;

      function getRufflePlayer() {
        const obj = document.getElementById("flash-container");
        if (obj && (typeof obj.pause === "function" || obj.metadata || obj.shadowRoot)) return obj;

        const ruffleTag = document.querySelector("ruffle-embed, ruffle-object, ruffle-player");
        if (ruffleTag) return ruffleTag;

        return null;
      }

      function setDynamicAspectRatio(width, height) {
        if (!width || !height || isRatioApplied) return;
        
        playerContainer.style.aspectRatio = `${width} / ${height}`;
        isRatioApplied = true;
      }

      const checkMetadata = () => {
        const player = getRufflePlayer();
        if (player) {
          const meta = player.metadata || (player.ruffle && player.ruffle().metadata);
          if (meta && meta.width && meta.height) {
            setDynamicAspectRatio(meta.width, meta.height);
          } else if (typeof player.addEventListener === "function") {
            player.addEventListener("loadedmetadata", () => {
              const loadedMeta = player.metadata || (player.ruffle && player.ruffle().metadata);
              if (loadedMeta) setDynamicAspectRatio(loadedMeta.width, loadedMeta.height);
            });
          }
        }
      };

      const metaInterval = setInterval(() => {
        checkMetadata();
        if (isRatioApplied) clearInterval(metaInterval);
      }, 100);

      setTimeout(() => clearInterval(metaInterval), 5000);

      function hideBarImmediately() {
        clearTimeout(hideTimeout);
        controlBar.classList.remove("visible");
        wrapper.classList.remove("hide-cursor");
      }

      function handleCursorInactivity() {
        clearTimeout(cursorTimeout);
        wrapper.classList.remove("hide-cursor");

        cursorTimeout = setTimeout(() => {
          if (!controlBar.classList.contains("visible")) {
            wrapper.classList.add("hide-cursor");
          }
        }, 2000);
      }

      document.addEventListener("mousemove", (e) => {
        const wrapperBounds = wrapper.getBoundingClientRect();
        const triggerThreshold = 8;

        const isAtBottomWindow = (window.innerHeight - e.clientY) <= triggerThreshold;
        const isAtBottomWrapper = (wrapperBounds.bottom - e.clientY) <= triggerThreshold && 
                                  e.clientX >= wrapperBounds.left && 
                                  e.clientX <= wrapperBounds.right;

        const barBounds = controlBar.getBoundingClientRect();
        const isHoveringBar = e.clientX >= barBounds.left && 
                              e.clientX <= barBounds.right && 
                              e.clientY >= barBounds.top && 
                              e.clientY <= barBounds.bottom;

        if (isAtBottomWindow || isAtBottomWrapper || isHoveringBar) {
          clearTimeout(hideTimeout);
          controlBar.classList.add("visible");
          wrapper.classList.remove("hide-cursor");
        } else {
          clearTimeout(hideTimeout);
          hideTimeout = setTimeout(() => {
            controlBar.classList.remove("visible");
          }, 50);
        }
      });

      wrapper.addEventListener("mousemove", handleCursorInactivity);

      wrapper.addEventListener("mouseleave", () => {
        hideBarImmediately();
        clearTimeout(cursorTimeout);
      });

      window.addEventListener("mouseleave", hideBarImmediately);

      playerContainer.addEventListener("click", () => {
        if (isPaused) {
          isPaused = false;
          playPauseBtn.textContent = "Pause";
        }
      });

      playPauseBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        playPauseBtn.blur();
        const player = getRufflePlayer();
        if (!player) return;

        if (isPaused) {
          if (typeof player.play === "function") player.play();
          isPaused = false;
          playPauseBtn.textContent = "Pause";
        } else {
          if (typeof player.pause === "function") player.pause();
          isPaused = true;
          playPauseBtn.textContent = "Play";
        }
      });

      reloadBtn.addEventListener("click", () => {
        reloadBtn.blur();
        const player = getRufflePlayer();
        if (!player) return;

        if (typeof player.reload === "function") {
          player.reload();
        } else {
          const container = document.getElementById("flash-container");
          if (container) {
            const currentData = container.getAttribute("data");
            container.setAttribute("data", "");
            setTimeout(() => container.setAttribute("data", currentData), 10);
          }
        }
        isPaused = false;
        playPauseBtn.textContent = "Pause";
      });

      fsBtn.addEventListener("click", () => {
        fsBtn.blur();
        if (!document.fullscreenElement) {
          if (wrapper.requestFullscreen) {
            wrapper.requestFullscreen();
          } else if (wrapper.webkitRequestFullscreen) {
            wrapper.webkitRequestFullscreen();
          } else if (wrapper.msRequestFullscreen) {
            wrapper.msRequestFullscreen();
          }
        } else {
          if (document.exitFullscreen) {
            document.exitFullscreen();
          }
        }
      });
    });
  </script>

</body>
</html>
