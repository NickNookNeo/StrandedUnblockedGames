<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flash Game Player</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(30, 41, 59, 0.9);
      --card-hover: #334155;
      --text-color: #f8fafc;
      --accent-color: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.35);
      --danger-color: #ef4444;
      --border-color: rgba(255, 255, 255, 0.1);
      --ambient-gradient: radial-gradient(circle at center, #1e293b 0%, #050811 100%);
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: var(--ambient-gradient) !important;
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      user-select: none;
    }

    body {
      padding: 0.75rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Header Controls */
    .header-container {
      width: 100%;
      max-width: 1200px;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
      flex-shrink: 0;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      width: 100%;
    }

    .back-btn {
      color: var(--text-color);
      text-decoration: none;
      background-color: var(--card-bg);
      backdrop-filter: blur(8px);
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      border: 1px solid var(--border-color);
      transition: background-color 0.2s, color 0.2s;
    }

    .back-btn:hover {
      background-color: var(--card-hover);
      color: var(--accent-color);
    }

    h1.game-title {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.5rem;
      font-weight: 800;
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #ffffff 0%, var(--accent-color) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      pointer-events: none;
    }

    .header-controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      width: 100%;
    }

    /* Main Container Frame */
    .player-wrapper {
      position: relative;
      width: 100%;
      max-width: 1200px;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent !important;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
    }

    /* Ruffle Embed Styling & Background Overrides */
    #flash-container, ruffle-embed, ruffle-object, ruffle-player {
      width: 100% !important;
      height: 100% !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      background: transparent !important;
      --ruffle-background-color: transparent !important;
    }

    .fps-counter {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--border-color);
      color: var(--accent-color);
      font-family: monospace;
      font-weight: bold;
      font-size: 0.8rem;
      padding: 4px 8px;
      border-radius: 4px;
      pointer-events: none;
      z-index: 20;
      display: none;
    }

    .fps-counter.active {
      display: block;
    }

    /* Auto-Hiding Control Bar */
    .control-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      padding: 10px 16px;
      border-top: 1px solid var(--border-color);
      transform: translateY(100%);
      transition: transform 0.2s ease-in-out;
      z-index: 50;
    }

    .control-bar.visible,
    .control-bar:hover {
      transform: translateY(0) !important;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .control-btn {
      padding: 6px 12px;
      background-color: rgba(255, 255, 255, 0.05);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      transition: background-color 0.2s, color 0.2s;
    }

    .control-btn:hover {
      background-color: var(--card-hover);
      color: var(--accent-color);
    }

    .volume-container {
      display: flex;
      align-items: center;
      gap: 6px;
      background-color: rgba(255, 255, 255, 0.03);
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }

    .mute-btn {
      border: none;
      background: transparent;
      color: var(--text-color);
      cursor: pointer;
    }

    .volume-slider {
      width: 65px;
      cursor: pointer;
    }

    /* Modal Overlay System */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 8, 17, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      width: 90%;
      max-width: 500px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.9);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.5rem;
    }

    .modal-header h3 {
      margin: 0;
      color: var(--accent-color);
    }

    .close-modal-btn {
      background: transparent;
      border: none;
      color: var(--text-color);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
    }

    .bind-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: 6px;
    }

    .bind-label {
      font-size: 0.85rem;
      font-weight: 600;
    }

    .bind-key {
      padding: 4px 10px;
      background: var(--card-bg);
      border: 1px solid var(--accent-color);
      color: var(--accent-color);
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .bind-key.listening {
      background: var(--accent-color);
      color: #000000;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from { opacity: 0.6; }
      to { opacity: 1; }
    }

    /* Fullscreen & Theater Overrides */
    .player-wrapper:fullscreen,
    .player-wrapper:-webkit-full-screen {
      width: 100vw !important;
      height: 100vh !important;
      max-width: 100vw !important;
      border-radius: 0 !important;
      border: none !important;
      background: var(--ambient-gradient) !important;
    }

    ::backdrop {
      background: var(--ambient-gradient) !important;
    }

    body.theater-mode {
      padding: 0 !important;
    }

    body.theater-mode .header-container {
      display: none !important;
    }

    body.theater-mode .player-wrapper {
      max-width: 100vw !important;
      width: 100vw !important;
      height: 100vh !important;
      border-radius: 0 !important;
      border: none !important;
      background: var(--ambient-gradient) !important;
    }
  </style>

  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      "scale": "showAll",
      "forceScale": false,
      "forceAlign": false,
      "letterbox": "on",
      "wmode": "opaque"
    };
  </script>
</head>
<body>

  <div class="header-container" id="header">
    <div class="header-top">
      <a href="../index.html" class="back-btn">&larr; Games List</a>
      <h1 class="game-title">Cactus McCoy</h1>
      <div style="width: 100px;"></div>
    </div>
    
    <div class="header-controls">
      <button class="control-btn" id="kb-btn">Keyboard Binds</button>
      <button class="control-btn" id="mapper-btn">Controller Binds</button>
    </div>
  </div>

  <div class="player-wrapper" id="player-wrapper" tabindex="0">
    <div class="fps-counter" id="fps-counter">FPS: 00</div>
    
    <object id="flash-container" type="application/x-shockwave-flash" data="cactusmccoy.swf">
      <param name="scale" value="showAll" />
      <param name="wmode" value="opaque" />
      <p>Unable to load Flash content.</p>
    </object>

    <div class="control-bar" id="control-bar">
      <div class="control-group">
        <button class="control-btn" id="play-pause-btn">Pause</button>
        <button class="control-btn" id="reload-btn">Restart</button>
        
        <div class="volume-container">
          <button class="mute-btn" id="mute-btn">🔊</button>
          <input type="range" class="volume-slider" id="volume-slider" min="0" max="1" step="0.05" value="1">
        </div>
      </div>
      
      <div class="control-group">
        <button class="control-btn" id="theater-btn">Theater</button>
        <button class="control-btn" id="fs-btn">Fullscreen</button>
      </div>
    </div>
  </div>

  <!-- Interactive Keyboard Mapping Modal -->
  <div class="modal-overlay" id="kb-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Keyboard Rebinding</h3>
        <button class="close-modal-btn" id="close-kb-modal">&times;</button>
      </div>
      <div class="bind-row">
        <span class="bind-label">Move Left</span>
        <button class="bind-key" data-action="left">LeftArrow</button>
      </div>
      <div class="bind-row">
        <span class="bind-label">Move Right</span>
        <button class="bind-key" data-action="right">RightArrow</button>
      </div>
      <div class="bind-row">
        <span class="bind-label">Jump / Action</span>
        <button class="bind-key" data-action="jump">A</button>
      </div>
      <div class="bind-row">
        <span class="bind-label">Attack</span>
        <button class="bind-key" data-action="attack">S</button>
      </div>
    </div>
  </div>

  <!-- Interactive Controller Mapping Modal -->
  <div class="modal-overlay" id="mapper-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Controller Rebinding</h3>
        <button class="close-modal-btn" id="close-mapper-modal">&times;</button>
      </div>
      <p style="font-size: 0.85rem; color: #94a3b8; margin: 0;" id="controller-status">
        Checking gamepad connection...
      </p>
      <div class="bind-row">
        <span class="bind-label">D-Pad / Left Stick</span>
        <button class="bind-key" id="pad-move">Connected</button>
      </div>
      <div class="bind-row">
        <span class="bind-label">Jump</span>
        <button class="bind-key" data-pad="0">Button 0 (A)</button>
      </div>
      <div class="bind-row">
        <span class="bind-label">Attack</span>
        <button class="bind-key" data-pad="2">Button 2 (X)</button>
      </div>
    </div>
  </div>

  <script>
    window.addEventListener("DOMContentLoaded", () => {
      const wrapper = document.getElementById("player-wrapper");
      const controlBar = document.getElementById("control-bar");
      const fsBtn = document.getElementById("fs-btn");
      const theaterBtn = document.getElementById("theater-btn");
      const playPauseBtn = document.getElementById("play-pause-btn");
      const reloadBtn = document.getElementById("reload-btn");

      /* Modals */
      const kbBtn = document.getElementById("kb-btn");
      const mapperBtn = document.getElementById("mapper-btn");
      const kbModal = document.getElementById("kb-modal");
      const mapperModal = document.getElementById("mapper-modal");
      const closeKbModal = document.getElementById("close-kb-modal");
      const closeMapperModal = document.getElementById("close-mapper-modal");
      const controllerStatus = document.getElementById("controller-status");

      let isPaused = false;
      let activeListeningBtn = null;

      function getRufflePlayer() {
        const obj = document.getElementById("flash-container");
        if (obj && (typeof obj.pause === "function" || obj.shadowRoot)) return obj;
        return document.querySelector("ruffle-embed, ruffle-object, ruffle-player");
      }

      /* Hover reveal for bottom bar */
      let hideTimeout;
      wrapper.addEventListener("mousemove", (e) => {
        const rect = wrapper.getBoundingClientRect();
        if (rect.bottom - e.clientY <= 60) {
          controlBar.classList.add("visible");
          clearTimeout(hideTimeout);
          hideTimeout = setTimeout(() => {
            if (!controlBar.matches(':hover')) controlBar.classList.remove("visible");
          }, 1500);
        }
      });

      wrapper.addEventListener("mouseleave", () => {
        controlBar.classList.remove("visible");
      });

      /* Fullscreen & Theater */
      fsBtn.addEventListener("click", () => {
        if (!document.fullscreenElement) {
          wrapper.requestFullscreen();
        } else {
          document.exitFullscreen();
        }
      });

      theaterBtn.addEventListener("click", () => {
        document.body.classList.toggle("theater-mode");
      });

      /* Pause/Play/Restart */
      playPauseBtn.addEventListener("click", () => {
        const player = getRufflePlayer();
        if (!player) return;
        if (isPaused) {
          if (player.play) player.play();
          playPauseBtn.textContent = "Pause";
        } else {
          if (player.pause) player.pause();
          playPauseBtn.textContent = "Play";
        }
        isPaused = !isPaused;
      });

      reloadBtn.addEventListener("click", () => {
        const player = getRufflePlayer();
        if (player && player.reload) player.reload();
      });

      /* Modal Display Controls */
      kbBtn.addEventListener("click", () => kbModal.classList.add("open"));
      closeKbModal.addEventListener("click", () => kbModal.classList.remove("open"));

      mapperBtn.addEventListener("click", () => {
        mapperModal.classList.add("open");
        checkGamepads();
      });
      closeMapperModal.addEventListener("click", () => mapperModal.classList.remove("open"));

      [kbModal, mapperModal].forEach(modal => {
        modal.addEventListener("click", (e) => {
          if (e.target === modal) modal.classList.remove("open");
        });
      });

      /* Interactive Key Rebinding Capture */
      document.querySelectorAll(".bind-key").forEach(btn => {
        btn.addEventListener("click", (e) => {
          if (activeListeningBtn) activeListeningBtn.classList.remove("listening");
          activeListeningBtn = e.target;
          activeListeningBtn.classList.add("listening");
          activeListeningBtn.textContent = "Press key...";
        });
      });

      window.addEventListener("keydown", (e) => {
        if (activeListeningBtn && kbModal.classList.contains("open")) {
          e.preventDefault();
          activeListeningBtn.textContent = e.key === " " ? "Space" : e.key;
          activeListeningBtn.classList.remove("listening");
          activeListeningBtn = null;
        }
      });

      /* Controller Connection Listener */
      function checkGamepads() {
        const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
        let connected = false;
        for (let i = 0; i < gamepads.length; i++) {
          if (gamepads[i]) {
            controllerStatus.textContent = `Active Gamepad: ${gamepads[i].id}`;
            connected = true;
            break;
          }
        }
        if (!connected) {
          controllerStatus.textContent = "No controller detected. Connect a gamepad and press any button.";
        }
      }

      window.addEventListener("gamepadconnected", checkGamepads);
      window.addEventListener("gamepaddisconnected", checkGamepads);
    });
  </script>

</body>
</html>
