<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flash Game Player</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(30, 41, 59, 0.9);
      --card-hover: #334155;
      --text-color: #f8fafc;
      --accent-color: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.35);
      --danger-color: #ef4444;
      --border-color: rgba(255, 255, 255, 0.1);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at center, #1e293b 0%, #050811 100%);
      background-attachment: fixed;
      color: var(--text-color);
      margin: 0;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      user-select: none;
      -webkit-user-select: none;
      transition: padding 0.3s ease;
    }

    /* Header Container */
    .header-container {
      width: 100%;
      max-width: 800px;
      display: grid;
      grid-template-columns: 140px 1fr 140px;
      align-items: center;
      margin-bottom: 1.5rem;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .back-btn {
      color: var(--text-color);
      text-decoration: none;
      background-color: var(--card-bg);
      backdrop-filter: blur(8px);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      border: 1px solid var(--border-color);
      transition: background-color 0.2s, color 0.2s;
      justify-self: start;
    }

    .back-btn:hover {
      background-color: var(--card-hover);
      color: var(--accent-color);
    }

    h1.game-title {
      font-size: 2.25rem;
      font-weight: 800;
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 3px;
      text-align: center;
      grid-column: 2;
      white-space: nowrap;
      background: linear-gradient(135deg, #ffffff 0%, var(--accent-color) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 4px 20px var(--accent-glow);
    }

    /* Player Container */
    .player-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 800px;
      min-height: 450px;
      margin: 0 auto;
      background: radial-gradient(circle at center, #1e293b 0%, #050811 100%);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(56, 189, 248, 0.05);
      transition: max-width 0.3s ease, width 0.3s ease;
    }

    .player-container {
      width: 100%;
      height: 100%;
      aspect-ratio: 4 / 3;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    #flash-container, ruffle-embed, ruffle-object, ruffle-player {
      width: 100% !important;
      height: 100% !important;
      max-width: 100% !important;
      max-height: 100% !important;
      display: block;
      background: transparent !important;
    }

    /* FPS Counter */
    .fps-counter {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--border-color);
      color: #38bdf8;
      font-family: monospace;
      font-weight: bold;
      font-size: 0.8rem;
      padding: 4px 8px;
      border-radius: 4px;
      pointer-events: none;
      z-index: 20;
      display: none;
    }

    .fps-counter.active {
      display: block;
    }

    /* Controls Bar */
    .control-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      padding: 12px 20px;
      border-top: 1px solid var(--border-color);
      transform: translateY(100%);
      transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.1s;
      z-index: 30;
      pointer-events: none;
    }

    .control-bar.visible {
      transform: translateY(0);
      pointer-events: auto;
      transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.15s;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .control-btn {
      padding: 8px 12px;
      background-color: rgba(255, 255, 255, 0.05);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: background-color 0.2s, color 0.2s, transform 0.1s;
    }

    .control-btn:hover {
      background-color: var(--card-hover);
      color: var(--accent-color);
    }

    .control-btn:active {
      transform: scale(0.95);
    }

    .control-btn:focus {
      outline: none;
    }

    .volume-container {
      display: flex;
      align-items: center;
      gap: 8px;
      background-color: rgba(255, 255, 255, 0.03);
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }

    .mute-btn {
      width: 28px;
      height: 28px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 0.95rem;
      border-radius: 4px;
      transition: background-color 0.2s;
    }

    .mute-btn:hover {
      background-color: rgba(255, 255, 255, 0.08);
    }

    .volume-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 65px;
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.2);
      outline: none;
      cursor: pointer;
      transition: background 0.2s;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent-color);
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .volume-slider::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    /* Modal Styling */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(5, 8, 17, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      width: 90%;
      max-width: 500px;
      padding: 1.5rem;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.75rem;
    }

    .modal-header h3 {
      margin: 0;
      color: var(--accent-color);
      font-size: 1.2rem;
    }

    .close-modal-btn {
      background: transparent;
      border: none;
      color: var(--text-color);
      font-size: 1.2rem;
      cursor: pointer;
    }

    .mapper-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 250px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .mapper-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255,255,255,0.03);
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }

    .bind-btn {
      padding: 4px 10px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--accent-color);
      border-radius: 4px;
      font-size: 0.8rem;
      cursor: pointer;
      min-width: 80px;
      text-align: center;
    }

    .bind-btn.listening {
      background: var(--accent-color);
      color: #000;
      font-weight: bold;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      border-top: 1px solid var(--border-color);
      padding-top: 0.75rem;
    }

    .reset-btn {
      padding: 6px 12px;
      background-color: rgba(239, 68, 68, 0.1);
      color: var(--danger-color);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, border-color 0.2s;
    }

    .reset-btn:hover {
      background-color: rgba(239, 68, 68, 0.2);
      border-color: var(--danger-color);
    }

    .reset-btn.confirm-state {
      background-color: var(--danger-color);
      color: #fff;
      font-weight: bold;
    }

    /* Theater Mode */
    body.theater-mode {
      padding: 0;
    }

    body.theater-mode .header-container {
      display: none;
    }

    body.theater-mode .player-wrapper {
      max-width: 100vw;
      width: 100vw;
      height: 100vh;
      border-radius: 0;
      border: none;
    }

    /* Fullscreen Mode */
    .player-wrapper:fullscreen {
      width: 100vw !important;
      height: 100vh !important;
      max-width: 100vw !important;
      max-height: 100vh !important;
      border-radius: 0 !important;
      border: none !important;
      margin: 0 !important;
      background: radial-gradient(circle at center, #1e293b 0%, #050811 100%) !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
    }

    .player-wrapper:fullscreen .player-container {
      max-width: 100vw !important;
      max-height: 100vh !important;
      width: auto !important;
      height: 100% !important;
      background: transparent !important;
    }

    .player-wrapper:fullscreen #flash-container,
    .player-wrapper:fullscreen ruffle-embed,
    .player-wrapper:fullscreen ruffle-object,
    .player-wrapper:fullscreen ruffle-player {
      background: transparent !important;
    }
  </style>

  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      "clip": true,
      "scale": "showAll",
      "letterbox": "off",
      "backgroundColor": null,
      "wmode": "transparent"
    };
  </script>
</head>
<body>

  <div class="header-container" id="header">
    <a href="../index.html" class="back-btn">&larr; Games List</a>
    <h1 class="game-title">Cactus McCoy</h1>
    <div></div>
  </div>

  <div class="player-wrapper" id="player-wrapper" tabindex="0">
    <div class="fps-counter" id="fps-counter">FPS: 00</div>
    <div class="player-container" id="player-container">
      <object id="flash-container" type="application/x-shockwave-flash" data="cactusmccoy.swf">
        <p>Unable to load Flash content.</p>
      </object>
    </div>

    <div class="control-bar" id="control-bar">
      <div class="control-group">
        <button class="control-btn" id="play-pause-btn">Pause</button>
        <button class="control-btn" id="reload-btn">Restart</button>
        
        <div class="volume-container">
          <button class="mute-btn" id="mute-btn" aria-label="Mute Volume">🔊</button>
          <input type="range" class="volume-slider" id="volume-slider" min="0" max="1" step="0.05" value="1">
        </div>
      </div>
      
      <div class="control-group">
        <button class="control-btn" id="scale-btn">Scale: Fit</button>
        <button class="control-btn" id="kb-btn">Keyboard</button>
        <button class="control-btn" id="mapper-btn">Controller</button>

        <button class="control-btn" id="fps-btn">FPS</button>
        <button class="control-btn" id="theater-btn">Theater</button>
        <button class="control-btn" id="fs-btn">Fullscreen</button>
      </div>
    </div>

    <!-- Controller Mapper Modal -->
    <div class="modal-overlay" id="mapper-modal">
      <div class="modal-card">
        <div class="modal-header">
          <h3>Gamepad Mapper</h3>
          <button class="close-modal-btn" id="close-modal">&times;</button>
        </div>
        <div id="gamepad-status" style="font-size: 0.85rem; color: #94a3b8;">No Gamepad Detected. Press any button on controller.</div>
        <div class="mapper-list" id="mapper-list"></div>
        <div class="modal-footer">
          <button class="reset-btn" id="reset-binds-btn">Reset Binds</button>
        </div>
      </div>
    </div>

    <!-- Keyboard Rebind Modal -->
    <div class="modal-overlay" id="kb-modal">
      <div class="modal-card">
        <div class="modal-header">
          <h3>Keyboard Rebinding</h3>
          <button class="close-modal-btn" id="close-kb-modal">&times;</button>
        </div>
        <div style="font-size: 0.85rem; color: #94a3b8;">Remap standard inputs to custom keys.</div>
        <div class="mapper-list" id="kb-list"></div>
        <div class="modal-footer">
          <button class="reset-btn" id="reset-kb-btn">Reset Defaults</button>
        </div>
      </div>
    </div>

  </div>

  <script>
    window.addEventListener("DOMContentLoaded", () => {
      const wrapper = document.getElementById("player-wrapper");
      const playerContainer = document.getElementById("player-container");
      const controlBar = document.getElementById("control-bar");
      const fsBtn = document.getElementById("fs-btn");
      const theaterBtn = document.getElementById("theater-btn");
      const playPauseBtn = document.getElementById("play-pause-btn");
      const reloadBtn = document.getElementById("reload-btn");
      const fpsBtn = document.getElementById("fps-btn");
      const fpsCounter = document.getElementById("fps-counter");
      const scaleBtn = document.getElementById("scale-btn");

      // Modals & Buttons
      const mapperBtn = document.getElementById("mapper-btn");
      const mapperModal = document.getElementById("mapper-modal");
      const closeModal = document.getElementById("close-modal");
      const gamepadStatus = document.getElementById("gamepad-status");
      const mapperList = document.getElementById("mapper-list");
      const resetBindsBtn = document.getElementById("reset-binds-btn");

      const kbBtn = document.getElementById("kb-btn");
      const kbModal = document.getElementById("kb-modal");
      const closeKbModal = document.getElementById("close-kb-modal");
      const kbList = document.getElementById("kb-list");
      const resetKbBtn = document.getElementById("reset-kb-btn");

      const muteBtn = document.getElementById("mute-btn");
      const volumeSlider = document.getElementById("volume-slider");

      let isPaused = false;
      let isRatioApplied = false;
      let previousVolume = 1;

      // Scaling Toggles
      const scaleModes = [
        { name: "Scale: Fit", value: "showAll" },
        { name: "Scale: Stretch", value: "exactFit" },
        { name: "Scale: Original", value: "noScale" }
      ];
      let currentScaleIdx = 0;

      scaleBtn.addEventListener("click", () => {
        scaleBtn.blur();
        currentScaleIdx = (currentScaleIdx + 1) % scaleModes.length;
        const currentMode = scaleModes[currentScaleIdx];
        scaleBtn.textContent = currentMode.name;

        const player = getRufflePlayer();
        if (player) {
          player.config = player.config || {};
          player.config.scale = currentMode.value;
        }
      });

      // Theater Mode Toggle
      theaterBtn.addEventListener("click", () => {
        theaterBtn.blur();
        document.body.classList.toggle("theater-mode");
        theaterBtn.style.color = document.body.classList.contains("theater-mode") ? "var(--accent-color)" : "var(--text-color)";
      });

      // FPS Logic
      let fpsActive = false;
      let realGameFrames = 0;
      let fpsIntervalId = null;

      function hookRuffleLoop() {
        const ruffleTag = document.querySelector("ruffle-embed, ruffle-object, ruffle-player");
        if (!ruffleTag) return;

        const shadowRoot = ruffleTag.shadowRoot || ruffleTag;
        const canvas = shadowRoot.querySelector("canvas");

        if (!canvas) {
          setTimeout(hookRuffleLoop, 200);
          return;
        }

        const gl = canvas.getContext("webgl2") || canvas.getContext("webgl");

        if (gl && !canvas.dataset.fpsHooked) {
          canvas.dataset.fpsHooked = "true";

          const origClear = gl.clear.bind(gl);
          gl.clear = function(...args) {
            if (fpsActive) realGameFrames++;
            return origClear(...args);
          };
        }
      }

      function updateFpsDisplay() {
        if (!fpsActive) return;
        fpsCounter.textContent = `FPS: ${realGameFrames}`;
        realGameFrames = 0;
      }

      fpsBtn.addEventListener("click", () => {
        fpsActive = !fpsActive;
        fpsCounter.classList.toggle("active", fpsActive);
        fpsBtn.style.color = fpsActive ? "var(--accent-color)" : "var(--text-color)";

        if (fpsActive) {
          realGameFrames = 0;
          hookRuffleLoop();
          if (fpsIntervalId) clearInterval(fpsIntervalId);
          fpsIntervalId = setInterval(updateFpsDisplay, 1000);
        } else {
          if (fpsIntervalId) clearInterval(fpsIntervalId);
          fpsCounter.textContent = "FPS: 00";
        }
      });

      // Keyboard Rebinding Logic
      const defaultKbBinds = [
        { label: "Action / Jump", targetKey: "Space", mappedCode: "Space", mappedKey: " " },
        { label: "Attack / Primary", targetKey: "X", mappedCode: "KeyX", mappedKey: "x" },
        { label: "Special / Secondary", targetKey: "Z", mappedCode: "KeyZ", mappedKey: "z" },
        { label: "Up", targetKey: "ArrowUp", mappedCode: "ArrowUp", mappedKey: "ArrowUp" },
        { label: "Down", targetKey: "ArrowDown", mappedCode: "ArrowDown", mappedKey: "ArrowDown" },
        { label: "Left", targetKey: "ArrowLeft", mappedCode: "ArrowLeft", mappedKey: "ArrowLeft" },
        { label: "Right", targetKey: "ArrowRight", mappedCode: "ArrowRight", mappedKey: "ArrowRight" }
      ];

      let kbBinds = JSON.parse(localStorage.getItem("flash_kb_binds")) || JSON.parse(JSON.stringify(defaultKbBinds));
      let kbListeningIndex = -1;

      function renderKbMapperUI() {
        kbList.innerHTML = "";
        kbBinds.forEach((bind, idx) => {
          const row = document.createElement("div");
          row.className = "mapper-row";
          row.innerHTML = `
            <span style="font-size: 0.85rem;">${bind.label}</span>
            <button class="bind-btn ${kbListeningIndex === idx ? 'listening' : ''}" data-kb-idx="${idx}">
              ${kbListeningIndex === idx ? 'Press Key...' : (bind.mappedKey === ' ' ? 'Space' : bind.mappedKey.toUpperCase())}
            </button>
          `;
          kbList.appendChild(row);
        });

        document.querySelectorAll("[data-kb-idx]").forEach(btn => {
          btn.addEventListener("click", (e) => {
            kbListeningIndex = parseInt(e.target.getAttribute("data-kb-idx"));
            renderKbMapperUI();
          });
        });
      }

      resetKbBtn.addEventListener("click", () => {
        kbBinds = JSON.parse(JSON.stringify(defaultKbBinds));
        localStorage.removeItem("flash_kb_binds");
        kbListeningIndex = -1;
        renderKbMapperUI();
      });

      kbBtn.addEventListener("click", () => {
        renderKbMapperUI();
        kbModal.classList.add("open");
      });

      closeKbModal.addEventListener("click", () => {
        kbModal.classList.remove("open");
        kbListeningIndex = -1;
      });

      // Keyboard remapping interceptor
      window.addEventListener("keydown", (e) => {
        if (kbListeningIndex !== -1) {
          e.preventDefault();
          kbBinds[kbListeningIndex].mappedKey = e.key;
          kbBinds[kbListeningIndex].mappedCode = e.code;
          localStorage.setItem("flash_kb_binds", JSON.stringify(kbBinds));
          kbListeningIndex = -1;
          renderKbMapperUI();
          return;
        }

        if (listeningIndex !== -1) return;

        // Map incoming key down events if matched
        const mapped = kbBinds.find(b => b.mappedCode === e.code);
        if (mapped && mapped.mappedKey !== mapped.targetKey) {
          e.stopImmediatePropagation();
          sendKeyEvent("keydown", mapped.targetKey, mapped.targetKey);
        }
      }, true);

      window.addEventListener("keyup", (e) => {
        const mapped = kbBinds.find(b => b.mappedCode === e.code);
        if (mapped && mapped.mappedKey !== mapped.targetKey) {
          e.stopImmediatePropagation();
          sendKeyEvent("keyup", mapped.targetKey, mapped.targetKey);
        }
      }, true);

      // Gamepad Mapping Logic
      const defaultBinds = [
        { label: "Button A (Jump/Action)", padIndex: 0, key: "Space", code: "Space" },
        { label: "Button B (Attack/Cancel)", padIndex: 1, key: "x", code: "KeyX" },
        { label: "Button X (Attack/Special)", padIndex: 2, key: "z", code: "KeyZ" },
        { label: "D-Pad Up / L-Stick Up", axisOrButton: "padUp", key: "ArrowUp", code: "ArrowUp" },
        { label: "D-Pad Down / L-Stick Down", axisOrButton: "padDown", key: "ArrowDown", code: "ArrowDown" },
        { label: "D-Pad Left / L-Stick Left", axisOrButton: "padLeft", key: "ArrowLeft", code: "ArrowLeft" },
        { label: "D-Pad Right / L-Stick Right", axisOrButton: "padRight", key: "ArrowRight", code: "ArrowRight" }
      ];

      let binds = JSON.parse(localStorage.getItem("flash_gamepad_binds")) || JSON.parse(JSON.stringify(defaultBinds));
      let listeningIndex = -1;
      let isResetConfirming = false;
      const activeState = {};

      function renderMapperUI() {
        mapperList.innerHTML = "";
        binds.forEach((bind, idx) => {
          const row = document.createElement("div");
          row.className = "mapper-row";
          row.innerHTML = `
            <span style="font-size: 0.85rem;">${bind.label}</span>
            <button class="bind-btn ${listeningIndex === idx ? 'listening' : ''}" data-idx="${idx}">
              ${listeningIndex === idx ? 'Press Key...' : bind.key}
            </button>
          `;
          mapperList.appendChild(row);
        });

        document.querySelectorAll("[data-idx]").forEach(btn => {
          btn.addEventListener("click", (e) => {
            listeningIndex = parseInt(e.target.getAttribute("data-idx"));
            resetConfirmState();
            renderMapperUI();
          });
        });
      }

      function resetConfirmState() {
        isResetConfirming = false;
        resetBindsBtn.textContent = "Reset Binds";
        resetBindsBtn.classList.remove("confirm-state");
      }

      resetBindsBtn.addEventListener("click", () => {
        if (!isResetConfirming) {
          isResetConfirming = true;
          resetBindsBtn.textContent = "Are you sure you want to set all to default?";
          resetBindsBtn.classList.add("confirm-state");
        } else {
          binds = JSON.parse(JSON.stringify(defaultBinds));
          localStorage.removeItem("flash_gamepad_binds");
          listeningIndex = -1;
          resetConfirmState();
          renderMapperUI();
        }
      });

      window.addEventListener("keydown", (e) => {
        if (listeningIndex !== -1) {
          e.preventDefault();
          binds[listeningIndex].key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
          binds[listeningIndex].code = e.code;
          localStorage.setItem("flash_gamepad_binds", JSON.stringify(binds));
          listeningIndex = -1;
          renderMapperUI();
        }
      });

      mapperBtn.addEventListener("click", () => {
        resetConfirmState();
        renderMapperUI();
        mapperModal.classList.add("open");
      });

      closeModal.addEventListener("click", () => {
        mapperModal.classList.remove("open");
        listeningIndex = -1;
        resetConfirmState();
      });

      function sendKeyEvent(type, key, code) {
        const evt = new KeyboardEvent(type, {
          key: key,
          code: code,
          bubbles: true,
          cancelable: true
        });
        wrapper.dispatchEvent(evt);
      }

      function pollGamepad() {
        const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
        let activePad = null;
        for (let i = 0; i < gamepads.length; i++) {
          if (gamepads[i]) {
            activePad = gamepads[i];
            break;
          }
        }

        if (activePad) {
          gamepadStatus.textContent = `Active: ${activePad.id.split('(')[0]}`;
          
          binds.forEach(bind => {
            let isPressed = false;
            
            if (bind.padIndex !== undefined && activePad.buttons[bind.padIndex]) {
              isPressed = activePad.buttons[bind.padIndex].pressed;
            } else if (bind.axisOrButton) {
              const axes = activePad.axes;
              if (bind.axisOrButton === "padUp") isPressed = (axes[1] && axes[1] < -0.5) || (activePad.buttons[12] && activePad.buttons[12].pressed);
              if (bind.axisOrButton === "padDown") isPressed = (axes[1] && axes[1] > 0.5) || (activePad.buttons[13] && activePad.buttons[13].pressed);
              if (bind.axisOrButton === "padLeft") isPressed = (axes[0] && axes[0] < -0.5) || (activePad.buttons[14] && activePad.buttons[14].pressed);
              if (bind.axisOrButton === "padRight") isPressed = (axes[0] && axes[0] > 0.5) || (activePad.buttons[15] && activePad.buttons[15].pressed);
            }

            const stateKey = bind.label;
            if (isPressed && !activeState[stateKey]) {
              activeState[stateKey] = true;
              sendKeyEvent("keydown", bind.key, bind.code);
            } else if (!isPressed && activeState[stateKey]) {
              activeState[stateKey] = false;
              sendKeyEvent("keyup", bind.key, bind.code);
            }
          });
        } else {
          gamepadStatus.textContent = "No Gamepad Detected. Connect or press any button.";
        }

        requestAnimationFrame(pollGamepad);
      }
      requestAnimationFrame(pollGamepad);

      function getRufflePlayer() {
        const obj = document.getElementById("flash-container");
        if (obj && (typeof obj.pause === "function" || obj.metadata || obj.shadowRoot)) return obj;

        const ruffleTag = document.querySelector("ruffle-embed, ruffle-object, ruffle-player");
        if (ruffleTag) return ruffleTag;

        return null;
      }

      function setDynamicAspectRatio(width, height) {
        if (!width || !height || isRatioApplied) return;
        playerContainer.style.aspectRatio = `${width} / ${height}`;
        isRatioApplied = true;
      }

      const checkMetadata = () => {
        const player = getRufflePlayer();
        if (player) {
          const meta = player.metadata || (player.ruffle && player.ruffle().metadata);
          if (meta && meta.width && meta.height) {
            setDynamicAspectRatio(meta.width, meta.height);
          } else if (typeof player.addEventListener === "function") {
            player.addEventListener("loadedmetadata", () => {
              const loadedMeta = player.metadata || (player.ruffle && player.ruffle().metadata);
              if (loadedMeta) setDynamicAspectRatio(loadedMeta.width, loadedMeta.height);
            });
          }
        }
      };

      const metaInterval = setInterval(() => {
        checkMetadata();
        if (isRatioApplied) clearInterval(metaInterval);
      }, 100);

      setTimeout(() => clearInterval(metaInterval), 5000);

      function toggleFullscreen() {
        if (!document.fullscreenElement) {
          if (wrapper.requestFullscreen) {
            wrapper.requestFullscreen();
          } else if (wrapper.webkitRequestFullscreen) {
            wrapper.webkitRequestFullscreen();
          } else if (wrapper.msRequestFullscreen) {
            wrapper.msRequestFullscreen();
          }
        } else {
          if (document.exitFullscreen) {
            document.exitFullscreen();
          }
        }
      }

      function updateVolume(val) {
        const player = getRufflePlayer();
        if (player) {
          player.volume = val;
        }
        volumeSlider.value = val;

        if (val == 0) {
          muteBtn.textContent = "🔇";
        } else if (val < 0.5) {
          muteBtn.textContent = "🔉";
        } else {
          muteBtn.textContent = "🔊";
        }
      }

      volumeSlider.addEventListener("input", (e) => {
        const val = parseFloat(e.target.value);
        updateVolume(val);
        if (val > 0) previousVolume = val;
      });

      muteBtn.addEventListener("click", () => {
        muteBtn.blur();
        if (volumeSlider.value > 0) {
          previousVolume = volumeSlider.value;
          updateVolume(0);
        } else {
          updateVolume(previousVolume || 1);
        }
      });

      document.addEventListener("mousemove", (e) => {
        const wrapperBounds = wrapper.getBoundingClientRect();
        const barBounds = controlBar.getBoundingClientRect();
        const triggerZoneHeight = 10;

        const distanceToBottom = wrapperBounds.bottom - e.clientY;
        const isXInside = e.clientX >= wrapperBounds.left && e.clientX <= wrapperBounds.right;
        
        const isHoveringBar = e.clientX >= barBounds.left && e.clientX <= barBounds.right &&
                              e.clientY >= barBounds.top && e.clientY <= barBounds.bottom;

        if ((isXInside && distanceToBottom >= 0 && distanceToBottom <= triggerZoneHeight) || isHoveringBar) {
          controlBar.classList.add("visible");
        } else {
          controlBar.classList.remove("visible");
        }
      });

      wrapper.addEventListener("mouseleave", () => controlBar.classList.remove("visible"));
      window.addEventListener("mouseleave", () => controlBar.classList.remove("visible"));

      playerContainer.addEventListener("click", () => {
        if (isPaused) {
          isPaused = false;
          playPauseBtn.textContent = "Pause";
        }
      });

      playPauseBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        playPauseBtn.blur();
        const player = getRufflePlayer();
        if (!player) return;

        if (isPaused) {
          if (typeof player.play === "function") player.play();
          isPaused = false;
          playPauseBtn.textContent = "Pause";
        } else {
          if (typeof player.pause === "function") player.pause();
          isPaused = true;
          playPauseBtn.textContent = "Play";
        }
      });

      reloadBtn.addEventListener("click", () => {
        reloadBtn.blur();
        const player = getRufflePlayer();
        if (!player) return;

        if (typeof player.reload === "function") {
          player.reload();
        } else {
          const container = document.getElementById("flash-container");
          if (container) {
            const currentData = container.getAttribute("data");
            container.setAttribute("data", "");
            setTimeout(() => container.setAttribute("data", currentData), 10);
          }
        }
        isPaused = false;
        playPauseBtn.textContent = "Pause";
      });

      fsBtn.addEventListener("click", () => {
        fsBtn.blur();
        toggleFullscreen();
      });
    });
  </script>

</body>
</html>
