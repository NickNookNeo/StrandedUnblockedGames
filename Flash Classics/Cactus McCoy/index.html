<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cactus McCoy</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-hover: #334155;
      --text-color: #f8fafc;
      --accent-color: #38bdf8;
      --border-color: rgba(255, 255, 255, 0.1);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .header-container {
      width: 100%;
      max-width: 1000px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
    }

    .back-btn {
      color: var(--text-color);
      text-decoration: none;
      background-color: var(--card-bg);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      border: 1px solid var(--border-color);
      transition: background-color 0.2s, transform 0.1s;
    }

    .back-btn:hover {
      background-color: var(--card-hover);
      color: var(--accent-color);
    }

    h1 {
      font-size: 2rem;
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--accent-color);
    }

    .player-wrapper {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 1000px;
      background-color: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .player-container {
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: #000;
    }

    #flash-container {
      width: 100%;
      height: 100%;
    }

    .control-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--card-bg);
      padding: 10px 16px;
      border-top: 1px solid var(--border-color);
    }

    .control-group {
      display: flex;
      gap: 10px;
    }

    .control-btn {
      padding: 8px 16px;
      background-color: var(--bg-color);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: background-color 0.2s, color 0.2s, transform 0.1s;
    }

    .control-btn:hover {
      background-color: var(--card-hover);
      color: var(--accent-color);
    }

    .control-btn:active {
      transform: scale(0.95);
    }

    .player-wrapper:fullscreen {
      width: 100vw;
      height: 100vh;
      max-width: none;
      border-radius: 0;
      border: none;
    }

    .player-wrapper:fullscreen .player-container {
      height: calc(100vh - 53px);
      aspect-ratio: auto;
    }
  </style>

  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      "clip": true,
      "scale": "showAll",
      "letterbox": "on"
    };
  </script>
</head>
<body>

  <div class="header-container">
    <a href="../index.html" class="back-btn">&larr; Games List</a>
    <h1>Cactus McCoy</h1>
    <div style="width: 100px;"></div> 
  </div>

  <div class="player-wrapper" id="player-wrapper">
    <div class="player-container">
      <object id="flash-container" type="application/x-shockwave-flash" data="cactusmccoy.swf">
        <p>Unable to load Flash content.</p>
      </object>
    </div>

    <div class="control-bar">
      <div class="control-group">
        <button class="control-btn" id="play-pause-btn">Pause</button>
        <button class="control-btn" id="reload-btn">Restart</button>
      </div>
      <div class="control-group">
        <button class="control-btn" id="fs-btn">Fullscreen</button>
      </div>
    </div>
  </div>

  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.addEventListener("DOMContentLoaded", () => {
      const wrapper = document.getElementById("player-wrapper");
      const fsBtn = document.getElementById("fs-btn");
      const playPauseBtn = document.getElementById("play-pause-btn");
      const reloadBtn = document.getElementById("reload-btn");

      function getRufflePlayer() {
        const container = document.getElementById("flash-container");
        if (container && typeof container.pause === "function") {
          return container;
        }
        const ruffleElement = document.querySelector("ruffle-embed, ruffle-object");
        if (ruffleElement && typeof ruffleElement.pause === "function") {
          return ruffleElement;
        }
        return null;
      }

      function syncState() {
        const player = getRufflePlayer();
        if (!player) return;

        let currentlyPlaying = true;
        if (typeof player.isPlaying === "function") {
          currentlyPlaying = player.isPlaying();
        } else if (player.shadowRoot) {
          const overlay = player.shadowRoot.querySelector("#play-overlay");
          if (overlay && overlay.style.display !== "none") {
            currentlyPlaying = false;
          }
        }

        if (currentlyPlaying) {
          playPauseBtn.textContent = "Pause";
        } else {
          playPauseBtn.textContent = "Play";
        }
      }

      setInterval(syncState, 100);

      fsBtn.addEventListener("click", () => {
        if (!document.fullscreenElement) {
          if (wrapper.requestFullscreen) {
            wrapper.requestFullscreen();
          } else if (wrapper.webkitRequestFullscreen) {
            wrapper.webkitRequestFullscreen();
          } else if (wrapper.msRequestFullscreen) {
            wrapper.msRequestFullscreen();
          }
        } else {
          if (document.exitFullscreen) {
            document.exitFullscreen();
          }
        }
      });

      playPauseBtn.addEventListener("click", () => {
        const player = getRufflePlayer();
        if (!player) return;

        let currentlyPlaying = true;
        if (typeof player.isPlaying === "function") {
          currentlyPlaying = player.isPlaying();
        } else if (player.shadowRoot) {
          const overlay = player.shadowRoot.querySelector("#play-overlay");
          if (overlay && overlay.style.display !== "none") {
            currentlyPlaying = false;
          }
        }

        if (currentlyPlaying) {
          player.pause();
          playPauseBtn.textContent = "Play";
        } else {
          player.play();
          playPauseBtn.textContent = "Pause";
        }
      });

      reloadBtn.addEventListener("click", () => {
        const player = getRufflePlayer();
        if (!player) return;

        if (typeof player.reload === "function") {
          player.reload();
        } else {
          const container = document.getElementById("flash-container");
          if (container) {
            const currentData = container.getAttribute("data");
            container.setAttribute("data", "");
            container.setAttribute("data", currentData);
          }
        }
        playPauseBtn.textContent = "Pause";
      });
    });
  </script>

</body>
</html>
