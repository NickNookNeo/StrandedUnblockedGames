<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flash Classics</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box; /* no scroll */
    }

    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-hover: #334155;
      --text-color: #f8fafc;
      --accent-color: #38bdf8;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      font-size: 2.2rem;
      margin-top: 0;
      margin-bottom: 2rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--accent-color);
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 320px));
      gap: 2rem;
      justify-content: center;
      width: 100%;
      max-width: 1100px;
    }

    .game-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .game-card:hover {
      transform: translateY(-5px);
      background-color: var(--card-hover);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
    }

    .image-container {
      width: 100%;
      height: 180px;
      background-color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .game-card img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain; /* makes big */
      display: block;
    }

    .game-title {
      padding: 1rem;
      font-size: 1.2rem;
      font-weight: 600;
      text-align: center;
    }
  </style>
</head>
<body>

  <h1>Flash Classics</h1>

  <div class="game-grid">
    
    <a href="./Cactus McCoy/" class="game-card">
      <div class="image-container">
        <img src="./assets/CactusMccoy1-Gameplay1.png" alt="Cactus McCoy">
      </div>
      <div class="game-title">Cactus McCoy</div>
    </a>

    <a href="./Mario Combat/" class="game-card">
      <div class="image-container">
        <img src="./assets/MarioCombat.jpg" alt="Mario Combat">
      </div>
      <div class="game-title">Mario Combat</div>
    </a>

  </div>

</body>
</html>
